<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nsh-shadcn — components</title>
<style>
:root {
  --background: #fff; --foreground: #0a0a0a; --muted: #f5f5f5; --muted-foreground: #737373;
  --border: #e5e5e5; --accent: #f5f5f5; --primary: #171717; --primary-foreground: #fafafa;
  --frame: #fafafa; color-scheme: light;
}
.dark { color-scheme: dark;
  --background: #0a0a0a; --foreground: #fafafa; --muted: #262626; --muted-foreground: #a1a1a1;
  --border: #ffffff1a; --accent: #262626; --primary: #e5e5e5; --primary-foreground: #171717;
  --frame: #171717;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--background); color: var(--foreground); -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: 248px 1fr; grid-template-rows: 56px 1fr;
}
a { color: inherit; }
header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 20px;
  border-bottom: 1px solid var(--border);
}
header .brand { font-weight: 600; font-size: 15px; }
header .brand span { color: var(--muted-foreground); font-weight: 400; margin-left: 8px; }
header .spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--background);
  color: var(--foreground); font: inherit; font-weight: 500; cursor: pointer; text-decoration: none;
}
.btn:hover { background: var(--accent); }
.btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
nav { border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 12px 32px; }
nav input {
  width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--background); color: var(--foreground); font: inherit; margin-bottom: 12px; outline: none;
}
nav input:focus { border-color: var(--muted-foreground); }
nav h4 { margin: 16px 8px 6px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
nav a {
  display: block; padding: 5px 8px; border-radius: 6px; text-decoration: none; font-size: 14px;
}
nav a:hover { background: var(--accent); }
nav a.active { background: var(--accent); font-weight: 500; }
main { overflow-y: auto; padding: 28px 36px 56px; }
main h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
main .family { color: var(--muted-foreground); font-size: 14px; margin-bottom: 4px; }
main .links { display: flex; gap: 8px; margin: 14px 0 22px; flex-wrap: wrap; }
.live { position: relative; max-width: 1100px; }
.live iframe {
  display: block; width: 100%; height: 640px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--frame);
}
.live .loading {
  position: absolute; inset: 1px; display: flex; align-items: center; justify-content: center;
  color: var(--muted-foreground); border-radius: 12px; background: var(--frame); pointer-events: none;
  transition: opacity .2s;
}
.live .loading.done { opacity: 0; }
.live p { font-size: 13px; color: var(--muted-foreground); margin: 8px 0 0; }
.notes { margin-top: 28px; max-width: 880px; }
.notes h2 { font-size: 16px; margin: 0 0 8px; }
.notes p { color: var(--muted-foreground); margin: 0 0 8px; }
.notes ul { margin: 0; padding-left: 20px; color: var(--muted-foreground); }
.notes li { margin: 4px 0; }
code { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--muted); padding: 1px 5px; border-radius: 4px; }
.hint { color: var(--muted-foreground); font-size: 13px; }
.usage { margin-top: 28px; max-width: 1100px; }
.usage h2, .doc h2 { font-size: 18px; margin: 28px 0 8px; letter-spacing: -0.01em; }
.usage .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.usage .bar p { margin: 0; flex: 1; color: var(--muted-foreground); }
pre {
  margin: 0; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--muted);
  overflow: auto; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 560px;
}
pre code { background: none; padding: 0; }
.doc { max-width: 880px; }
.doc p, .doc li { color: var(--muted-foreground); }
.doc p code, .doc li code { color: var(--foreground); }
.doc pre { margin: 8px 0 16px; }
.kw { color: #a626a4; } .dark .kw { color: #c678dd; }
.st { color: #50a14f; } .dark .st { color: #98c379; }
.cm { color: #a0a1a7; font-style: italic; } .dark .cm { color: #7f848e; }
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: 56px auto 1fr; }
  nav { border-right: 0; border-bottom: 1px solid var(--border); max-height: 40vh; }
}
</style>
</head>
<body>
<header>
  <div class="brand">nsh-shadcn<span>shadcn/ui for NSH, in Rust</span></div>
  <div class="spacer"></div>
  <span class="hint">← → to move</span>
  <button class="btn" id="theme">Dark</button>
  <a class="btn" href="https://github.com/caoxing9/nsh-shadcn">GitHub</a>
</header>
<nav>
  <input id="search" placeholder="Search components…" autocomplete="off">
  <div id="list"></div>
</nav>
<main id="main"></main>

owUp, \"Submit\").secondary().size(ui::ButtonSize::IconSm))\n                .child(ui::button(\"Please wait\").disabled(true).icon(Some(IconName::LoaderCircle))),\n        ))\n        .child(section(\n            \"Disabled\",\n            row()\n                .child(ui::button(\"Button\").disabled(true))\n                .child(ui::button(\"Secondary\").secondary().disabled(true))\n                .child(ui::button(\"Destructive\").destructive().disabled(true))\n                .child(ui::button(\"Outline\").outline().disabled(true)),\n        ))\n        .child(\n            text(move || format!(\"Pressed: {}\", presses.get()))\n                .text_sm()\n                .text_color(move || theme().muted_foreground),\n        )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/button.rs"}, {"id": "badge", "title": "Badge", "family": "Basics", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/basics/badge.rs", "shadcn": "https://ui.shadcn.com/docs/components/badge", "notes": ["`[&>svg]:pointer-events-none [&>svg]:size-3` size an icon in the badge; NSH has no child selectors, so the `icon` prop's icon takes `size-3`.", "`transition-[color,box-shadow]` is `transition`: NSH has no arbitrary transition properties; `transition` animates colors and shadows (the focus ring), as shadcn's list does.", "The `[a&]:hover:…` classes style a badge that is a link (`asChild` with an `<a>`); a badge here is never one, so they are left out.", "`aria-invalid:` is the `invalid` prop's."], "usage": "fn badge() -> View {\n    let count = \"h-5 min-w-5 rounded-full px-1 font-mono tabular-nums\";\n    view()\n        .gap_8()\n        .child(section(\n            \"Variants\",\n            row()\n                .child(ui::badge(\"Badge\"))\n                .child(ui::badge(\"Secondary\").secondary())\n                .child(ui::badge(\"Destructive\").destructive())\n                .child(ui::badge(\"Outline\").outline()),\n        ))\n        .child(section(\n            \"With icon and counts\",\n            row()\n                .child(\n                    ui::badge(\"Verified\")\n                        .secondary()\n                        .icon(Some(IconName::BadgeCheck))\n                        .app_class(cls(\"bg-blue-500 text-white dark:bg-blue-600\")),\n                )\n                .child(ui::badge(\"8\").app_class(cls(count)))\n                .child(ui::badge(\"99\").destructive().app_class(cls(count)))\n                .child(ui::badge(\"20+\").outline().app_class(cls(count))),\n        ))\n        .child(section(\n            \"With spinner\",\n            row()\n                .gap_4()\n                .child(spinner_badge(\"Syncing\", ui::BadgeVariant::Default))\n                .child(spinner_badge(\"Updating\", ui::BadgeVariant::Secondary))\n                .child(spinner_badge(\"Processing\", ui::BadgeVariant::Outline)),\n        ))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/basics.rs"}, {"id": "card", "title": "Card", "family": "Basics", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/basics/card.rs", "shadcn": "https://ui.shadcn.com/docs/components/card", "notes": ["`border` is `border border-border` (shadcn's global `* { @apply border-border }`; NSH has no global rules).", "`CardHeader`'s `@container/card-header` is left out: NSH has no container queries, and nothing in a card queries it.", "`has-data-[slot=card-action]:grid-cols-[1fr_auto]` follows the header's `action` slot: NSH has no `:has()`, so the action is a prop of the header, which takes the second column while it holds one.", "`Card` adds `text-base`: shadcn's card text with no size of its own (the title) inherits the page's 16px / 1.5; NSH's default text is 14 points.", "`[.border-b]:pb-6` (header) and `[.border-t]:pt-6` (footer) pad a header or footer the app gave a border; NSH cannot select on the app's classes, so an app =true]:pointer-events-none group-data-[disabled=true]:opacity-50` dim the label of a disabled control; NSH has no `peer-` or `group-data-` selectors, so the `disabled` prop does (`cursor-not-allowed opacity-50`, and no presses).", "Radix's `htmlFor` (a click on the label is a click on its control) is the `onPress` event: the app presses the control."], "usage": "fn label() -> View {\n    let accepted = signal(false);\n    let toggle = move || accepted.update(|a| *a = !*a);\n    view().child(\n        view()\n            .app_class(cls(\"flex items-center space-x-2\"))\n            .child(\n                nsh_base::checkbox()\n                    .checked(accepted)\n                    .accessibility_label(\"Accept terms and conditions\")\n                    .indicator_class(cls(CHECKBOX))\n                    .indicator(dynamic(move || {\n                        accepted.get().then(|| {\n                            ui::icon(IconName::Check)\n                                .app_class(cls(\"size-3.5\"))\n                                .into_element()\n                        })\n                    }))\n                    .on_change(move |checked: &bool| accepted.set(*checked)),\n            )\n            .child(ui::label(\"Accept terms and conditions\").on_press(toggle)),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/basics.rs"}, {"id": "kbd", "title": "Kbd", "family": "Basics", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/basics/kbd.rs", "shadcn": "https://ui.shadcn.com/docs/components/kbd", "notes": ["`[&_svg:not([class*='size-'])]:size-3` sizes an icon in the key; NSH has no descendant selectors, so the `icon` prop's icon takes `size-3`.", "`[[data-slot=tooltip-content]_&]:bg-background/20 [[data-slot=tooltip-content]_&]:text-background dark:[[data-slot=tooltip-content]_&]:bg-background/10` restyle a key inside a tooltip; NSH cannot select on an ancestor, so a key in a tooltip takes (\"Ensure sufficient funds\"))\n                                .child(bullet(\"Verify billing address\")),\n                        ),\n                )\n                .into_element(),\n        ])\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/basics.rs"}, {"id": "avatar", "title": "Avatar", "family": "Basics", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/basics/avatar.rs", "shadcn": "https://ui.shadcn.com/docs/components/avatar", "notes": ["shadcn's `AvatarImage` and `AvatarFallback` are parts `nsh_base`'s avatar draws itself: here they are the avatar's `src` / `alt` and `fallback` props, their classes its image and fallback classes (`imageClass` and `fallbackClass` add the app's, as their `className`).", "`data-[size=lg]:size-10 data-[size=sm]:size-6` and the `group-data-[size=…]/avatar:` classes of the fallback and the badge follow the `size` prop (the avatar tells its badge its size: a context).", "`AvatarGroup`'s `*:data-[slot=avatar]:ring-2 *:data-[slot=avatar]:ring-background` ring the avatars in it: the group tells them they are in one (a context), and they take the classes.", "`AvatarGroupCount`'s `group-has-data-[size=…]/avatar-group:` classes follow its own `size` prop (NSH cannot look at its siblings), and its `[&>svg]:…` sizes the `icon` prop's icon.", "`AvatarBadge`'s `[&>svg]:…` sizes the `icon` prop's icon.", "`AvatarGroup` shows every avatar it holds (`nsh_base`'s group would show three by default)."], "usage": "fn avatar() -> View {\n    view()\n        .gap_8()\n        .child(section(\n            \"Demo\",\n            view()\n                .app_class(cls(\"flex flex-row flex-wrap items-center gap-12\"))\n                .child(ui::avatar(\"CN\").alt(\"@shadcn\"))\n                .child(\n                    ui::avatar(\"ER\")\n                        .alt(\"@evilrabbit\")\n                        .app_class(cls(\"rounded-lg\")),\n                )\n                .child(\n                    ui::avatar_group()\n                        .app_class(cls(\"grayscale\"))\n                        .child(ui::avatar(\"CN\").alt(\"@shadcn\"))\n                        .child(ui::avatar(\"LR\").alt(\"@maxleiter\"))\n                        .child(ui::avatar(\"ER\").alt(\"@evilrabbit\")),\n                ),\n        ))\n        .child(section(\n            \"Sizes\",\n            row()\n                .gap_4()\n                .child(ui::avatar(\"CN\").alt(\"@shadcn\").sm())\n                .child(ui::avatar(\"CN\").alt(\"@shadcn\"))\n                .child(ui::avatar(\"CN\").alt(\"@shadcn\").lg()),\n        ))\n        .child(section(\n            \"Badge\",\n            row()\n                .gap_6()\n                .child(\n                    ui::avatar(\"CN\")\n                        .alt(\"@shadcn\")\n                        .sm()\n                        .child(ui::avatar_badge()),\n                )\n                .child(\n                    ui::avatar(\"CN\")\n                        .alt(\"@shadcn\")\n                        .child(ui::avatar_badge().app_class(cls(\"bg-green-600 dark:bg-green-800\"))),\n                )\n                .child(\n                    ui::avatar(\"CN\")\n                        .alt(\"@shadcn\")\n                        .lg()\n                        .child(ui::avatar_badge().icon(Some(IconName::Plus))),\n                ),\n        ))\n        .child(section(\n            \"Group with count\",\n            row().child(\n                ui::avatar_group()\n                    .child(ui::avatar(\"CN\").alt(\"@shadcn\"))\n                    .child(ui::avatar(\"LR\").alt(\"@maxleiter\"))\n                    .child(ui::avatar(\"ER\").alt(\"@evilrabbit\"))\n                    .child(ui::avatar_group_count(\"+3\")),\n            ),\n        ))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/basics.rs"}, {"id": "aspect-ratio", "title": "Aspect Ratio", "family": "Basics", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/basics/aspect_ratio.rs", "shadcn": "https://ui.shadcn.com/docs/components/aspect-ratio", "notes": [], "usage": "fn aspect_ratio() -> View {\n    view().child(\n        ui::aspect_ratio(16.0 / 9.0)\n            .app_class(cls(\"rounded-lg bg-muted\"))\n            .child(\n                image(ImageSrc::from(PHOTO))\n                    .accessible(true)\n                    .role(AccessibilityRole::Image)\n                    .label(\"Photo by Drew Beamer\")\n                    .app_class(cls(\n                        \"absolute inset-0 h-full w-full rounded-lg object-cover dark:brightness-[0.2] dark:grayscale\",\n                    )),\n            ),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/basics.rs"}, {"id": "empty", "title": "Empty", "family": "Basics", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/basics/empty.rs", "shadcn": "https://ui.shadcn.com/docs/components/empty", "notes": ["`EmptyMedia`'s `[&_svg]:pointer-events-none [&_svg]:shrink-0` and the icon variant's `[&_svg:not([class*='size-'])]:size-6` size an icon in it; NSH has no descendant selectors, so the `icon` prop's icon takes them.", "`EmptyDescription`'s `[&>a]:underline [&>a]:underline-offset-4 [&>a:hover]:text-primary` style a link in it; a link there takes them as the app's classes.", "`Empty` adds `text-base`: text in it with no size of its own inherits the page's 16px / 1.5 in shadcn; NSH's default text is 14 points.", "`text-balance` lays lines out as NSH wraps any text: NSH has no balanced wrapping, so a description breaks where it fills its line.", "An `Empty` with a border (shadcn's examples add `border border-dashed`) names its color too: `border border-dashed border-border`."], "usage": "fn empty() -> View {\n    view()\n        .app_class(cls(\"flex flex-row gap-6\"))\n        .child(\n            ui::empty()\n                .child(\n                    ui::empty_header()\n                        .child(\n                            ui::empty_media()\n                                .variant(ui::EmptyMediaVariant::Icon)\n                                .icon(Some(IconName::FolderCode)),\n                        )\n                        .child(ui::empty_title(\"No Projects Yet\"))\n                        .child(ui::empty_description(\n                            \"You haven't created any projects yet. Get started by creating your first project.\",\n                        )),\n                )\n                .child(\n                    ui::empty_content().child(\n                        view()\n                            .app_class(cls(\"flex flex-row gap-2\"))\n                            .child(ui::button(\"Create Project\"))\n                            .child(ui::button(\"Import Project\").outline()),\n                    ),\n                )\n                .child(\n                    ui::button(\"Learn More\")\n                        .link()\n                        .sm()\n                        .app_class(cls(\"text-muted-foreground px-2.5\"))\n                        .child(ui::icon(IconName::ArrowUpRight)),\n                ),\n        )\n        .child(\n            ui::empty()\n                .app_class(cls(\"border border-dashed border-border\"))\n                .child(\n                    ui::empty_header()\n                        .child(\n                            ui::empty_media()\n                                .variant(ui::EmptyMediaVariant::Icon)\n                                .icon(Some(IconName::Cloud)),\n                        )\n                        .child(ui::empty_title(\"Cloud Storage Empty\"))\n                        .child(ui::empty_description(\n                            \"Upload files to your cloud storage to access them anywhere.\",\n                        )),\n                )\n                .child(ui::empty_content().child(ui::button(\"Upload Files\").outline().sm())),\n        )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/basics.rs"}, {"id": "item", "title": "Item", "family": "Basics", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/basics/item.rs", "shadcn": "https://ui.shadcn.com/docs/components/item", "notes": ["`border` is `border border-border` where shadcn relies on its global `* { @apply border-border }` (the icon media's).", "`[a]:transition-colors [a]:hover:bg-accent/50` style an item that is a link (`asChild` with an `<a>`): an item given an `href` is one (`nsh_base`'s `Link`), and takes them.", "`ItemMedia`'s `group-has-[[data-slot=item-description]]/item:translate-y-0.5` and `…:self-start` move the media to the top of an item that has a description: each [`ItemDescription`] tells the item it is there (a context), and the item's media take the classes.", "`ItemMedia`'s `[&_svg]:pointer-events-none`, the icon variant's `[&_svg:not([class*='size-'])]:size-4` and the image variant's `[&_img]:size-full [&_img]:object-cover` style its icon and image: NSH has no descendant selectors, so the `icon` and `src` props place them with those classes (an icon of the default variant is Lucide's 24 points; `iconClass` sizes it, as shadcn's examples do with `className=\"size-5\"`).", "`ItemContent`'s `[&+[data-slot=item-content]]:flex-none` (a second content block keeps its width) is the app's `flex-none` on it.", "`ItemTitle`'s and `ItemDescription`'s `[&>a]:…` style a link in them; a link there takes them as the app's classes.", "`ItemGroup` is a list for screen readers, as its `role=\"list\"`."], "usage": "fn item() -> View {\n    let open = |title: &'static str, description: &'static str| {\n        ui::item_content()\n            .child(ui::item_title(title))\n            .child(ui::item_description(description))\n    };\n    view()\n        .gap_8()\n        .child(section(\n            \"Demo\",\n            view()\n                .app_class(cls(\"flex w-full max-w-md flex-col gap-6\"))\n                .child(\n                    ui::item()\n                        .outline()\n                        .child(open(\n                            \"Basic Item\",\n                            \"A simple item with title and description.\",\n                        ))\n                        .child(ui::item_actions().child(ui::button(\"Action\").outline().sm())),\n                )\n                .child(\n                    ui::item()\n                        .outline()\n                        .sm()\n                        .href(\"#\")\n                        .child(\n                            ui::item_media()\n                                .icon(Some(IconName::BadgeCheck))\n                                .icon_class(\"size-5\"),\n                        )\n                        .child(\n                            ui::item_content()\n                                .child(ui::item_title(\"Your profile has been verified.\")),\n                        )\n                        .child(ui::item_actions().child(ui::icon(IconName::ChevronRight))),\n                ),\n        ))\n        .child(section(\n            \"Variants\",\n            view()\n                .app_class(cls(\"flex flex-col gap-6\"))\n                .child(\n                    ui::item()\n                        .child(open(\n                            \"Default Variant\",\n                            \"Standard styling with subtle background and borders.\",\n                        ))\n                        .child(ui::item_actions().child(ui::button(\"Open\").outline().sm())),\n                )\n                .child(\n                    ui::item()\n                        .outline()\n                        .child(open(\n                            \"Outline Variant\",\n                            \"Outlined style with clear borders and transparent background.\",\n                        ))\n                        .child(ui::item_actions().child(ui::button(\"Open\").outline().sm())),\n                )\n                .child(\n                    ui::item()\n                        .muted()\n                        .child(open(\n                            \"Muted Variant\",\n                            \"Subdued appearance with muted colors for secondary content.\",\n                        ))\n                        .child(ui::item_actions().child(ui::button(\"Open\").outline().sm())),\n                ),\n        ))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/basics.rs"}, {"id": "breadcrumb", "title": "Breadcrumb", "family": "Basics", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/basics/breadcrumb.rs", "shadcn": "https://ui.shadcn.com/docs/components/breadcrumb", "notes": ["`BreadcrumbList`'s `break-words` is left out: NSH breaks a word that does not fit its line on its own.", "`BreadcrumbSeparator`'s `[&>svg]:size-3.5` sizes the separator's icon (the `icon` prop's: `chevron-right` by default, as shadcn's children `?? <ChevronRight />`).", "`BreadcrumbEllipsis`'s `sr-only` \"More\" is left out: the ellipsis is `aria-hidden` in shadcn, so no screen reader hears it.", "The list and its items are a list for screen readers (`<ol>`, `<li>`)."], "usage": "fn breadcrumb() -> View {\n    let opened = signal(SharedString::from(\"none\"));\n    let link = move |label: &'static str, href: &'static str| {\n        ui::breadcrumb_item().child(\n            ui::breadcrumb_link(label)\n                .href(href)\n                .on_press(move || opened.set(SharedString::from(label))),\n        )\n    };\n    view()\n        .gap_8()\n        .child(section(\n            \"Demo\",\n            view().child(\n                ui::breadcrumb().child(\n                    ui::breadcrumb_list()\n                        .child(link(\"Home\", \"/\"))\n                        .child(ui::breadcrumb_separator())\n                        .child(\n                            ui::breadcrumb_item()\n                                .child(ui::breadcrumb_ellipsis().app_class(cls(\"size-4\"))),\n                        )\n                        .child(ui::breadcrumb_separator())\n                        .child(link(\"Components\", \"/docs/components\"))\n                        .child(ui::breadcrumb_separator())\n                        .child(ui::breadcrumb_item().child(ui::breadcrumb_page(\"Breadcrumb\"))),\n                ),\n            ),\n        ))\n        .child(section(\n            \"Custom separator\",\n            view().child(\n                ui::breadcrumb().child(\n                    ui::breadcrumb_list()\n                        .child(link(\"Home\", \"/\"))\n                        .child(ui::breadcrumb_separator().with_icon(IconName::Slash))\n                        .child(link(\"Components\", \"/components\"))\n                        .child(ui::breadcrumb_separator().with_icon(IconName::Slash))\n                        .child(ui::breadcrumb_item().child(ui::breadcrumb_page(\"Breadcrumb\"))),\n                ),\n            ),\n        ))\n        .child(\n            text(move || format!(\"Opened: {}\", opened.get()))\n                .text_sm()\n                .text_color(move || theme().muted_foreground),\n        )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/basics.rs"}, {"id": "pagination", "title": "Pagination", "family": "Basics", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/basics/pagination.rs", "shadcn": "https://ui.shadcn.com/docs/components/pagination", "notes": ["The links' `buttonVariants` are [`crate::Button`]'s, with their own adaptations; `has-[>svg]:px-*` holds for Previous and Next, which always show a chevron.", "Previous and Next take `gap-1 px-2.5 sm:pl-2.5` / `sm:pr-2.5` after the button's classes, as shadcn's `className`; in CSS the button's `has-[>svg]:px-3` outranks a plain class (`:has()` adds to its specificity), so both keep 12 points of padding, as here, where `px-3` comes last.", "The chevrons are 16 points (the button's `[&_svg]:size-4`).", "`PaginationEllipsis`'s `sr-only` \"More pages\" is left out: the ellipsis is `aria-hidden` in shadcn, so no screen reader hears it.", "The content and its items are a list for screen readers (`<ul>`, `<li>`)."], "usage": "fn pagination() -> View {\n    let page = signal(2_u32);\n    let link = move |n: u32| {\n        ui::pagination_item().child(\n            ui::pagination_link(n.to_string())\n                .href(\"#\")\n                .is_active(move || page.get() == n)\n                .on_press(move || page.set(n)),\n        )\n    };\n    view()\n        .gap_8()\n        .child(\n            ui::pagination().child(\n                ui::pagination_content()\n                    .child(\n                        ui::pagination_item().child(\n                            ui::pagination_previous()\n                                .href(\"#\")\n                                .on_press(move || page.update(|p| *p = p.saturating_sub(1).max(1))),\n                        ),\n                    )\n                    .child(link(1))\n                    .child(link(2))\n                    .child(link(3))\n                    .child(ui::pagination_item().child(ui::pagination_ellipsis()))\n                    .child(\n                        ui::pagination_item().child(\n                            ui::pagination_next()\n                                .href(\"#\")\n                                .on_press(move || page.update(|p| *p = (*p + 1).min(3))),\n                        ),\n                    ),\n            ),\n        )\n        .child(\n            text(move || format!(\"Page: {}\", page.get()))\n                .text_sm()\n                .text_color(move || theme().muted_foreground),\n        )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/basics.rs"}, {"id": "progress", "title": "Progress", "family": "Basics", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/basics/progress.rs", "shadcn": "https://ui.shadcn.com/docs/components/progress", "notes": [], "usage": "fn progress() -> View {\n    let value = signal(13.0_f32);\n    set_timeout(std::time::Duration::from_millis(500), move || {\n        value.set(66.0)\n    });\n    view().child(ui::progress(13.0).value(value).app_class(cls(\"w-[60%]\")))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/basics.rs"}, {"id": "table", "title": "Table", "family": "Basics", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/basics/table.rs", "shadcn": "https://ui.shadcn.com/docs/components/table", "notes": ["`border-b` / `border-t` are `border-b border-border` / `border-t border-border` (shadcn's global `* { @apply border-border }`).", "The table's container (`relative w-full overflow-x-auto`) and the table are one view, `relative w-full text-sm`: NSH has no `overflow-x-auto` (a wide table goes in the app's horizontal `scroll()`), nor `caption-bottom` (the app places the caption last).", "`TableHeader`'s `[&_tr]:border-b` is the rows' own `border-b`.", "`TableBody`'s `[&_tr:last-child]:border-0` and `TableFooter`'s `[&>tr]:last:border-b-0` drop the last row's border: NSH cannot select the last child, so the group clips it (`overflow-hidden` around its rows, pulled up a point with `-mb-px`), which draws the same pixels.", "`TableRow`'s `data-[state=selected]:bg-muted` is the `selected` prop's; `has-aria-expanded:bg-muted/50` (a row holding an expanded control) is left out: NSH has no `:has()`.", "`TableHead` and `TableCell` are views, not table cells: `align-middle` centers their content with `justify-center` (they lay it out in a column). `[&:has([role=checkbox])]:pr-0` and `[&>[role=checkbox]]:translate-y-[2px]` are the app's `pr-0` and the checkbox's `translate-y-[2px]`.", "`TableCaption` adds `text-center`, the browser's own style of a `<caption>`."], "usage": "fn table() -> View {\n    let col = |i: usize, extra: &'static str| -> Option<SharedString> {\n        Some(SharedString::from(format!(\"{} {extra}\", COLUMNS[i])))\n    };\n    view().child(\n        ui::table()\n            .child(\n                ui::table_header().child(\n                    ui::table_row()\n                        .child(ui::table_head(\"Invoice\").app_class(col(0, \"\")))\n                        .child(ui::table_head(\"Status\").app_class(col(1, \"\")))\n                        .child(ui::table_head(\"Method\").app_class(col(2, \"\")))\n                        .child(ui::table_head(\"Amount\").app_class(col(3, \"text-right\"))),\n                ),\n            )\n            .child(ui::table_body().children(INVOICES.iter().map(\n                |&(invoice, status, amount, method)| {\n                    ui::table_row()\n                        .child(ui::table_cell(invoice).app_class(col(0, \"font-medium\")))\n                        .child(ui::table_cell(status).app_class(col(1, \"\")))\n                        .child(ui::table_cell(method).app_class(col(2, \"\")))\n                        .child(ui::table_cell(amount).app_class(col(3, \"text-right\")))\n                },\n            )))\n            .child(\n                ui::table_footer().child(\n                    ui::table_row()\n                        .child(ui::table_cell(\"Total\").app_class(cls(\"w-[582px]\")))\n                        .child(ui::table_cell(\"$2,500.00\").app_class(col(3, \"text-right\"))),\n                ),\n            )\n            .child(ui::table_caption(\"A list of your recent invoices.\")),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/basics.rs"}, {"id": "input", "title": "Input", "family": "Forms", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/forms/input.rs", "shadcn": "https://ui.shadcn.com/docs/components/input", "notes": ["`shrink` is added: a flex item shrinks in CSS by default, not in NSH, and shadcn's `w-full min-w-0` field shrinks beside a button.", "`transition-[color,box-shadow]` (an arbitrary property list, unknown to NSH) is `transition`.", "`selection:text-primary-foreground`: NSH's `selection:` takes the highlight's color only; the selected text keeps its color.", "`file:…` (the file button of `type=\"file\"`) is left out: NSH's field has no file type (pick files with `pick_files`).", "`aria-invalid:` follows the `invalid` prop, which the field reports to screen readers as invalid.", "Textarea's `field-sizing-content` (unknown to NSH): the field's height follows its text's (`onContentSizeChange`), over `min-h-16`."], "usage": "fn input() -> View {\n    columns(\n        column()\n            .child(section(\n                \"Default\",\n                div(\"flex w-full max-w-sm flex-col\")\n                    .child(ui::input().placeholder(some(\"Email\")).email()),\n            ))\n            .child(section(\n                \"Disabled\",\n                div(\"flex w-full max-w-sm flex-col\").child(\n                    ui::input()\n                        .placeholder(some(\"Email\"))\n                        .email()\n                        .disabled(true),\n                ),\n            ))\n            .child(section(\n                \"Invalid\",\n                div(\"flex w-full max-w-sm flex-col\").child(\n                    ui::input()\n                        .placeholder(some(\"Email\"))\n                        .default_value(some(\"not an email\"))\n                        .email()\n                        .invalid(true),\n                ),\n            )),\n        column()\n            .child(section(\n                \"With label\",\n                div(\"grid w-full max-w-sm items-center gap-3\")\n                    .child(label(\"Email\"))\n                    .child(ui::input().placeholder(some(\"Email\")).email()),\n            ))\n            .child(section(\n                \"With button\",\n                div(\"flex w-full max-w-sm items-center gap-2\")\n                    .child(ui::input().placeholder(some(\"Email\")).email())\n                    .child(ui::button(\"Subscribe\").outline()),\n            ))\n            .child(section(\n                \"With text\",\n                div(\"grid w-full max-w-sm items-center gap-3\")\n                    .child(label(\"Email\"))\n                    .child(ui::input().placeholder(some(\"Email\")).email())\n                    .child(p(\n                        \"Enter your email address.\",\n                        \"text-sm text-muted-foreground\",\n                    )),\n            )),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/forms.rs"}, {"id": "textarea", "title": "Textarea", "family": "Forms", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/forms/mod.rs", "shadcn": "https://ui.shadcn.com/docs/components/textarea", "notes": [], "usage": "fn textarea() -> View {\n    let message = signal(SharedString::default());\n    columns(\n        column()\n            .child(section(\n                \"Default\",\n                div(\"flex w-full flex-col\")\n                    .child(ui::textarea().placeholder(some(\"Type your message here.\"))),\n            ))\n            .child(section(\n                \"Disabled\",\n                div(\"flex w-full flex-col\").child(\n                    ui::textarea()\n                        .placeholder(some(\"Type your message here.\"))\n                        .disabled(true),\n                ),\n            ))\n            .child(status(move || format!(\"Message: {}\", message.get()))),\n        column()\n            .child(section(\n                \"With label\",\n                div(\"grid w-full gap-3\")\n                    .child(label(\"Your message\"))\n                    .child(ui::textarea().placeholder(some(\"Type your message here.\"))),\n            ))\n            .child(section(\n                \"With button\",\n                div(\"grid w-full gap-2\")\n                    .child(\n                        ui::textarea()\n                            .placeholder(some(\"Write a message\"))\n                            .on_change(move |value: &SharedString| message.set(value.clone())),\n                    )\n                    .child(ui::button(\"Send message\")),\n            ))\n            .child(section(\n                \"With text\",\n                div(\"grid w-full gap-3\")\n                    .child(label(\"Your Message\"))\n                    .child(ui::textarea().placeholder(some(\"Type your message here.\")))\n                    .child(p(\n                        \"Your message will be copied to the support team.\",\n                        \"text-sm text-muted-foreground\",\n                    )),\n            )),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/forms.rs"}, {"id": "checkbox", "title": "Checkbox", "family": "Forms", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/forms/checkbox.rs", "shadcn": "https://ui.shadcn.com/docs/components/checkbox", "notes": ["`data-[state=checked]:` is `checked:`: NSH's variant of the checked state the root reports.", "`focus-visible:checked:border-primary` is added: in CSS `data-[state=checked]:border-primary` comes after `focus-visible:border-ring`, so a focused checked box keeps its primary border; NSH ranks `checked:` below the interaction states.", "`peer` is left out (NSH has no `peer-*`): a label beside a disabled checkbox dims itself.", "`flex items-center justify-center` is added: the root is a `<button>` in shadcn, which centers its content.", "`border` is `border border-input` already in shadcn.", "Radix's `indeterminate` state is not ported: shadcn draws it as an unchecked box holding the same check mark."], "usage": "fn checkbox() -> View {\n    let terms = signal(false);\n    let card = signal(true);\n    columns(\n        column().child(section(\n            \"Demo\",\n            div(\"flex flex-col gap-6\")\n                .child(\n                    div(\"flex items-center gap-3\")\n                        .child(\n                            ui::checkbox()\n                                .accessibility_label(some(\"Terms\"))\n                                .on_checked_change(move |checked: &bool| terms.set(*checked)),\n                        )\n                        .child(label(\"Accept terms and conditions\")),\n                )\n                .child(\n                    div(\"flex items-start gap-3\")\n                        .child(ui::checkbox().default_checked(true))\n                        .child(\n                            div(\"grid shrink gap-2\")\n                                .child(label(\"Accept terms and conditions\"))\n                                .child(p(\n                                    \"By clicking this checkbox, you agree to the terms and conditions.\",\n                                    \"text-sm text-muted-foreground\",\n                                )),\n                        ),\n                )\n                .child(\n                    div(\"flex items-start gap-3\")\n                        .child(ui::checkbox().disabled(true))\n                        .child(div(\"flex items-center gap-2 text-sm leading-none font-medium select-none opacity-50\").child(text(\"Enable notifications\"))),\n                )\n                .child(\n                    view()\n                        .app_class(move || Some(SharedString::from(if card.get() {\n                            \"flex items-start gap-3 rounded-lg border border-border p-3 hover:bg-accent/50 border-blue-600 bg-blue-50 dark:border-blue-900 dark:bg-blue-950\"\n                        } else {\n m/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/forms.rs"}, {"id": "radio-group", "title": "Radio Group", "family": "Forms", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/forms/radio_group.rs", "shadcn": "https://ui.shadcn.com/docs/components/radio-group", "notes": ["The indicator, `CircleIcon` with `absolute top-1/2 left-1/2 size-2 -translate-x-1/2 -translate-y-1/2 fill-primary`, is that circle with those classes, filled with the text color (`text-primary` on the item): Lucide's circle stroked and filled.", "`aria-invalid:` is the item's `invalid` prop: its classes apply while it is set (`nsh_base`'s radio reports no invalid state).", "`mt-px` beside a [`super::FieldContent`] in a horizontal field is Field's `[&>[role=radio]]:mt-px`."], "usage": "fn radio_group() -> View {\n    let density = signal(SharedString::from(\"comfortable\"));\n    columns(\n        column()\n            .child(section(\n                \"Demo\",\n                div(\"flex flex-col\").child(\n                    ui::radio_group()\n                        .default_value(some(\"comfortable\"))\n                        .on_value_change(move |value: &SharedString| density.set(value.clone()))\n                        .child(radio_option(\"default\", \"Default\"))\n                        .child(radio_option(\"comfortable\", \"Comfortable\"))\n                        .child(radio_option(\"compact\", \"Compact\")),\n                ),\n            ))\n            .child(status(move || format!(\"Density: {}\", density.get()))),\n        column().child(section(\n            \"Disabled\",\n            div(\"flex flex-col\").child(\n                ui::radio_group()\n                    .default_value(some(\"one\"))\n                    .disabled(true)\n                    .child(radio_option(\"one\", \"Option One\"))\n                    .child(radio_option(\"two\", \"Option Two\")),\n            ),\n        )),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/forms.rs"}, {"id": "switch", "title": "Switch", "family": "Forms", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/forms/switch.rs", "shadcn": "https://ui.shadcn.com/docs/components/switch", "notes": ["`data-[state=checked]:` is `checked:`, and `data-[state=unchecked]:` the plain class; in dark, `dark:checked:bg-primary` (root) keeps the checked fill over `dark:bg-input/80`, which CSS's exclusive states do.", "`data-[size=…]:` / `group-data-[size=…]/switch:` are the `size` prop's.", "`translate-x-[calc(100%-2px)]` (unknown to NSH) is the length it comes to: 14 points (`translate-x-3.5`) at the default size, 10 (`translate-x-2.5`) at `sm`.", "`peer` is left out (NSH has no `peer-*`)."], "usage": "fn switch() -> View {\n    let airplane = signal(false);\n    columns(\n        column()\n            .child(section(\n                \"Demo\",\n                div(\"flex items-center gap-2\")\n                    .child(\n                        ui::switch()\n                            .accessibility_label(some(\"Airplane Mode\"))\n                            .on_checked_change(move |checked: &bool| airplane.set(*checked)),\n                    )\n                    .child(label(\"Airplane Mode\")),\n            ))\n            .child(status(move || {\n                format!(\n                    \"Airplane mode: {}\",\n                    if airplane.get() { \"on\" } else { \"off\" }\n                )\n            })),\n        column()\n            .child(section(\n                \"Sizes\",\n                div(\"flex items-center gap-4\")\n                    .child(ui::switch().size(ui::SwitchSize::Sm))\n                    .child(ui::switch().size(ui::SwitchSize::Sm).default_checked(true))\n                    .child(ui::switch())\n                    .child(ui::switch().default_checked(true)),\n            ))\n            .child(section(\n                \"Disabled\",\n                div(\"flex items-center gap-4\")\n                    .child(ui::switch().disabled(true))\n                    .child(ui::switch().disabled(true).default_checked(true)),\n            )),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/forms.rs"}, {"id": "slider", "title": "Slider", "family": "Forms", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/forms/slider.rs", "shadcn": "https://ui.shadcn.com/docs/components/slider", "notes": ["`data-[orientation=…]:` are the `orientation` prop's, `data-[disabled]:` is `disabled:`.", "`touch-none` (unknown to NSH, which has no browser gestures to stop) is left out.", "The rail's `overflow-hidden` clips the range to the rail's rounded ends in a browser; here the thumbs are inside the rail, which must not clip them, so the range is `rounded-full` instead (its ends are the rail's or under a thumb).", "`transition-[color,box-shadow]` (unknown to NSH) is `transition`.", "The thumb's `disabled:pointer-events-none disabled:opacity-50` are left out: Radix's thumb is a `<span>`, which `:disabled` never matches, so only the root dims a disabled slider (NSH's thumb would dim twice).", "A thumb is centered on its value; Radix keeps a thumb inside the rail at its ends (half a thumb's width in at `min` and `max`, the same in the middle)."], "usage": "fn slider() -> View {\n    let volume = signal(50.0_f64);\n    columns(\n        column()\n            .child(section(\n                \"Demo\",\n                div(\"flex flex-col\").child(\n                    ui::slider()\n                        .default_value(vec![50.0])\n                        .max(100.0)\n                        .step(1.0)\n                        .accessibility_label(some(\"Volume\"))\n                        .on_value_change(move |v: &Vec<f64>| volume.set(v[0]))\n                        .app_class(some(\"w-[60%]\")),\n                ),\n            ))\n            .child(section(\n                \"Range\",\n                div(\"flex flex-col\").child(\n                    ui::slider()\n                        .default_value(vec![25.0, 75.0])\n                        .app_class(some(\"w-[60%]\")),\n                ),\n            ))\n            .child(section(\n                \"Disabled\",\n                div(\"flex flex-col\").child(\n                    ui::slider()\n                        .default_value(vec![33.0])\n                        .disabled(true)\n                        .app_class(some(\"w-[60%]\")),\n                ),\n            ))\n            .child(status(move || format!(\"Volume: {}\", volume.get()))),\n        column().child(section(\n            \"Vertical\",\n            div(\"flex h-44 flex-row gap-8\")\n                .child(\n                    ui::slider()\n                        .default_value(vec![50.0])\n                        .orientation(ui::SliderOrientation::Vertical),\n                )\n                .child(\n                    ui::slider()\n                        .default_value(vec![20.0, 80.0])\n                        .orientation(ui::SliderOrientation::Vertical),\n                ),\n        )),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/forms.rs"}, {"id": "toggle", "title": "Toggle", "family": "Forms", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/forms/toggle.rs", "shadcn": "https://ui.shadcn.com/docs/components/toggle", "notes": ["`data-[state=on]:` is `aria-pressed:`, NSH's variant of a toggle button that is on.", "`[&_svg]:…` (the icon's size) is the `icon` prop's `size-4`.", "`transition-[color,box-shadow]` (unknown to NSH) is `transition`.", "`aria-invalid:` is the `invalid` prop's: its classes apply while it is set (`nsh_base`'s toggle reports no invalid state).", "`border` is `border border-input` already in shadcn."], "usage": "fn toggle() -> View {\n    let bookmarked = signal(false);\n    columns(\n        column()\n            .child(section(\n                \"Demo\",\n                div(\"flex flex-row\").child(\n                    ui::toggle()\n                        .outline()\n                        .sm()\n                        .pressed(move || Some(bookmarked.get()))\n                        .on_pressed_change(move |on: &bool| bookmarked.set(*on))\n                        .accessibility_label(some(\"Toggle bookmark\"))\n                        .app_class(some(\"aria-pressed:bg-transparent\"))\n                        .child(dynamic(move || {\n                            if bookmarked.get() {\n                                blue_bookmark()\n                            } else {\n                                ui::icon(IconName::Bookmark).into_element()\n                            }\n                        }))\n                        .child(text(\"Bookmark\")),\n                ),\n            ))\n            .child(section(\n                \"Outline\",\n                div(\"flex flex-row\").child(\n                    ui::toggle()\n                        .outline()\n                        .icon(Some(IconName::Italic))\n                        .accessibility_label(some(\"Toggle italic\")),\n                ),\n            ))\n            .child(section(\n                \"With text\",\n                div(\"flex flex-row\").child(\n                    ui::toggle()\n                        .icon(Some(IconName::Italic))\n                        .label(some(\"Italic\"))\n                        .accessibility_label(some(\"Toggle italic\")),\n                ),\n            ))\n            .child(status(move || {\n                format!(\n                    \"Bookmarked: {}\",\n                    if bookmarked.get() { \"yes\" } else { \"no\" }\n                )\n            })),\n        column()\n            .child(section(\n                \"Sizes\",\n                div(\"flex flex-row items-center gap-2\")\n                    .child(\n                        ui::toggle()\n                            .sm()\n                            .icon(Some(IconName::Italic))\n                            .accessibility_label(some(\"Small\")),\n                    )\n                    .child(\n                        ui::toggle()\n                            .icon(Some(IconName::Italic))\n                            .accessibility_label(some(\"Default\")),\n                    )\n                    .child(\n                        ui::toggle()\n                            .lg()\n                            .icon(Some(IconName::Italic))\n                            .accessibility_label(some(\"Large\")),\n                    ),\n            ))\n            .child(section(\n                \"On\",\n                div(\"flex flex-row items-center gap-2\")\n                    .child(\n                        ui::toggle()\n                            .default_pressed(true)\n                            .icon(Some(IconName::Bold))\n                            .accessibility_label(some(\"Bold on\")),\n                    )\n                    .child(\n                        ui::toggle()\n                            .outline()\n                            .default_pressed(true)\n                            .icon(Some(IconName::Bold))\n                            .accessibility_label(some(\"Bold on outline\")),\n                    ),\n            ))\n            .child(section(\n                \"Disabled\",\n                div(\"flex flex-row\").child(\n                    ui::toggle()\n                        .disabled(true)\n                        .icon(Some(IconName::Underline))\n                        .accessibility_label(some(\"Toggle underline\")),\n                ),\n            )),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/forms.rs"}, {"id": "toggle-group", "title": "Toggle Group", "family": "Forms", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/forms/toggle_group.rs", "shadcn": "https://ui.shadcn.com/docs/components/toggle-group", "notes": ["`gap-[--spacing(var(--gap))]` (a CSS variable NSH has no syntax for) is `gap-<spacing>`, the same length.", "`data-[spacing=0]:` and `data-[variant=outline]:` are the group's `spacing` and `variant` props'; `first:` and `last:` are NSH's.", "`data-[spacing=default]:data-[variant=outline]:shadow-xs` never applies in shadcn (`data-spacing` is a number) and is left out."], "usage": "fn toggle_group() -> View {\n    let on = signal(Vec::<SharedString>::new());\n    columns(\n        column()\n            .child(section(\n                \"Outline\",\n                formatting(\n                    ui::toggle_group()\n                        .r#type(ui::ToggleGroupType::Multiple)\n                        .variant(ui::ToggleVariant::Outline)\n                        .on_value_change(move |v: &Vec<SharedString>| on.set(v.clone())),\n                ),\n            ))\n            .child(section(\n                \"Single\",\n                formatting(ui::toggle_group().default_value(vec![\"italic\".into()])),\n            ))\n            .child(section(\n                \"Small\",\n                formatting(ui::toggle_group().size(ui::ToggleSize::Sm)),\n            ))\n            .child(status(move || {\n                let on = on.get();\n                format!(\n                    \"On: {}\",\n                    if on.is_empty() {\n                        \"none\".to_string()\n                    } else {\n                        on.join(\", \")\n                    }\n                )\n            })),\n        column()\n            .child(section(\n                \"Large\",\n                formatting(\n                    ui::toggle_group()\n                        .r#type(ui::ToggleGroupType::Multiple)\n                        .size(ui::ToggleSize::Lg),\n                ),\n            ))\n            .child(section(\n                \"Disabled\",\n                for lasses and `duration-200` are tw-animate-css keyframes, which NSH does not have: the modal layer fades in and out as a whole (`ModalAnimation::Fade`), overlay and content together, without the content's `zoom-in-95`.", "`max-w-[calc(100%-2rem)]`: NSH has no `calc()` in sizes; at the `sm:` breakpoint and above (640 points) `sm:max-w-lg` takes its place anyway.", "The close button's `[&_svg]:…` size its icon: the icon takes `size-4`. Its `data-[state=open]:…` classes never match in shadcn (Radix's `Close` has no `data-state`) and are left out.", "`DialogOverlay` is drawn by the root, under the content, rather than by `DialogContent`: the content is the modal's own part, so the app's classes on it (`.app_class(\"sm:max-w-[425px]\")`) style the card.", "`fixed` boxes are fixed to the modal layer, which covers the window.", "`text-base` is added to the content: a portal's content inherits the page body's text (the browser's 16 px, on Tailwind's base line height 1.5), which NSH's text, 14 points by default, does not have."], "usage": "fn dialog() -> View {\n    centered().child(\n        ui::dialog().trigger(ui::button(\"Open Dialog\").outline()).child(\n            ui::dialog_content()\n                .app_class(cls(\"sm:max-w-[425px]\"))\n                .child(\n                    ui::dialog_header()\n                        .child(ui::dialog_title(\"Edit profile\"))\n                        .child(ui::dialog_description(\n                            \"Make changes to your profile here. Click save when you're done.\",\n                        )),\n                )\n                .child(\n                    view()\n                        .app_class(cls(\"grid gap-4\"))\n                        .child(field(\"Name\", \"Pedro Duarte\"))\n                        .child(field(\"Username\", \"@peduarte\")),\n                )\n                .child(\n                    ui::dialog_footer()\n                        .child(ui::dialog_close(ui::button(\"Cancel\").outline()))\n                        .child(ui::button(\"Save changes\")),\n                ),\n        ),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/overlays.rs"}, {"id": "alert-dialog", "title": "Alert Dialog", "family": "Overlays", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/overlays/alert_dialog.rs", "shadcn": "https://ui.shadcn.com/docs/components/alert-dialog", "notes": ["`border` is `border border-border`.", "The animation classes are tw-animate-css's: the modal layer fades in and out as a whole (`ModalAnimation::Fade`), without `zoom-in-95`.", "`max-w-[calc(100%-2rem)]` is left out (no `calc()` in NSH's sizes; `sm:max-w-lg` / `max-w-xs` take its place at the window sizes it acts at).", "`data-[size=…]:`, `group-data-[size=…]/alert-dialog-content:` and `has-data-[slot=alert-dialog-media]:` select on the content's `size` and on whether the header holds an [`AlertDialogMedia`]: the parts pick those classes from the `size` prop and the media through context (NSH has no group or `has-` selectors).", "`*:[svg:not([class*='size-'])]:size-8` sizes the media's icon: the `icon` prop's icon takes `size-8`.", "`text-base` is added to the content: a portal's content inherits the page body's text (the browser's 16 px, on Tailwind's base line height 1.5), which NSH's text, 14 points by default, does not have."], "usage": "fn alert_dialog() -> View {\n    centered().child(\n        ui::alert_dialog().trigger(ui::button(\"Show Dialog\").outline()).child(\n            ui::alert_dialog_content()\n                .child(\n                    ui::alert_dialog_header()\n                        .child(ui::alert_dialog_title(\"Are you absolutely sure?\"))\n                        .child(ui::alert_dialog_description(\n                            \"This action cannot be undone. This will permanently delete your \\\n                             account and remove your data from our servers.\",\n                        )),\n                )\n                .child(\n                    ui::alert_dialog_footer()\n                        .child(ui::alert_dialog_cancel(\"Cancel\"))\n                        .child(ui::alert_dialog_action(\"Continue\")),\n                ),\n        ),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/overlays.rs"}, {"id": "sheet", "title": "Sheet", "family": "Overlays", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/overlays/sheet.rs", "shadcn": "https://ui.shadcn.com/docs/components/sheet", "notes": ["`border-l` / `-r` / `-t` / `-b` name their color (`border-border`).", "The `data-[state=…]:animate-* slide-* duration-*` classes are tw-animate-css's: the panel's slide and the overlay's fade are `nsh_base::Sheet`'s motion (`SheetMotion`), on its own timing rather than 500 ms in and 300 ms out.", "`SheetContent`'s box is the sheet's panel, which the core places: the app's classes for it (shadcn's `className`, `w-[400px]`) go in its `class` prop.", "The close button's `data-[state=open]:bg-secondary` never matches in shadcn (Radix's `Close` has no `data-state`) and is left out.", "`text-base` is added to the content: a portal's content inherits the page body's text (the browser's 16 px, on Tailwind's base line height 1.5), which NSH's text, 14 points by default, does not have."], "usage": "fn sheet() -> View {\n    centered()\n        .child(\n            ui::sheet()\n                .trigger(ui::button(\"Open\").outline())\n                .child(sheet_content(ui::SheetSide::Right)),\n        )\n        .child(\n            view()\n                .app_class(cls(\"grid grid-cols-2 gap-2\"))\n                .child(sheet_side(ui::SheetSide::Top, \"top\"))\n                .child(sheet_side(ui::SheetSide::Right, \"right\"))\n                .child(sheet_side(ui::SheetSide::Bottom, \"bottom\"))\n                .child(sheet_side(ui::SheetSide::Left, \"left\")),\n        )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/overlays.rs"}, {"id": "drawer", "title": "Drawer", "family": "Overlays", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/overlays/drawer.rs", "shadcn": "https://ui.shadcn.com/docs/components/drawer", "notes": ["`border-t` / `-b` / `-l` / `-r` name their color (`border-border`).", "`data-[vaul-drawer-direction=…]:` and `group-data-[vaul-drawer-direction=…]/drawer-content:` select on the direction: the parts pick those classes from the content's `direction` (through context for the header and the handle). The handle's `hidden … group-data-[…=bottom]:block` is: drawn only at the bottom. The header's `md:text-left` is left out at the top and bottom, where Tailwind sorts `group-data-[…]:text-center` after it (it wins in shadcn at every width); NSH sorts breakpoints last.", "`max-h-[80vh]` is `max-h-[80%]`: NSH has no viewport units, and the panel is fixed to the window, whose height `%` measures.", "vaul's slide is `nsh_base::Sheet`'s motion (`SheetMotion`), its overlay's fade the sheet's backdrop fade.", "`DrawerContent`'s box is the sheet's panel, which the core places: the app's classes for it go in its `class` prop.", "`text-base` is added to the content: a portal's content inherits the page body's text (the browser's 16 px, on Tailwind's base line height 1.5), which NSH's text, 14 points by default, does not have."], "usage": "fn drawer() -> View {\n    let goal = signal(350_i32);\n    let adjust = move |by: i32| goal.update(|g| *g = (*g + by).clamp(200, 400));\n    let round = |icon: IconName, name: &'static str| {\n        ui::icon_button(icon, name)\n            .outline()\n            .app_class(cls(\"h-8 w-8 shrink-0 rounded-full\"))\n    };\n    centered().child(\n        ui::drawer().trigger(ui::button(\"Open Drawer\").outline()).child(\n            ui::drawer_content().child(\n                view()\n                    .app_class(cls(\"mx-auto w-full max-w-sm\"))\n                    .child(\n                        ui::drawer_header()\n                            .child(ui::drawer_title(\"Move Goal\"))\n                            .child(ui::drawer_description(\"Set your daily activity goal.\")),\n                    )\n                    .child(\n                        view()\n                            .app_class(cls(\"p-4 pb-0\"))\n                            .child(\n                                view()\n                                    .app_class(cls(\"flex items-center justify-center space-x-2\"))\n                                    .child(\n                                        round(IconName::Minus, \"Decrease\")\n                                            .disabled(move || goal.get() <= 200)\n                                            .on_press(move || adjust(-10)),\n                                    )\n                                    .child(\n                                        view()\n                                            .app_class(cls(\"flex-1 text-center\"))\n                                            .child(\n                                                text(move || goal.get().to_string()).app_class(cls(\n                                                    \"text-7xl font-bold tracking-tighter\",\n                                                )),\n                                            )\n                                            .child(text(\"Calories/day\").app_class(cls(\n                                                \"text-[0.70rem] text-muted-foreground uppercase\",\n                                            ))),\n                                    )\n                                    .child(\n                                        round(IconName::Plus, \"Increase\")\n                                            .disabled(move || goal.get() >= 400)\n                                            .on_press(move || adjust(10)),\n                                    ),\n                            )\n                            .child(bars()),\n                    )\n                    .child(\n                        ui::drawer_footer()\n                            .child(ui::button(\"Submit\"))\n                            .child(ui::drawer_close(ui::button(\"Cancel\").outline())),\n                    ),\n            ),\n        ),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/overlays.rs"}, {"id": "popover", "title": "Popover", "family": "Overlays", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/overlays/popover.rs", "shadcn": "https://ui.shadcn.com/docs/components/popover", "notes": ["`border` is `border border-border`.", "The animation classes (`data-[state=open]:animate-in fade-in-0 zoom-in-95 data-[side=…]:slide-in-from-…-2`, and out) are tw-animate-css's: they are the popup's starting and ending looks, with a 150 ms transition between them (`super::motion`); the `origin-(--radix-popover-content-transform-origin)` is the side facing the trigger (`origin-top` below it, …).", "`align`, `side` and `side_offset`, which shadcn gives `PopoverContent`, are the root's props: the root places the popup.", "`text-base` is added to the content: a portal's content inherits the page body's text (the browser's 16 px, on Tailwind's base line height 1.5), which NSH's text, 14 points by default, does not have."], "usage": "fn popover() -> View {\n    centered().child(\n        ui::popover().trigger(ui::button(\"Open popover\").outline()).child(\n            ui::popover_content().app_class(cls(\"w-80\")).child(\n                view()\n                    .app_class(cls(\"grid gap-4\"))\n                    .child(\n                        view()\n                            .app_class(cls(\"space-y-2\"))\n                            .child(text(\"Dimensions\").app_class(cls(\"leading-none font-medium\")))\n                            .child(\n                                text(\"Set the dimensions for the layer.\")\n                                    .app_class(cls(\"text-sm text-muted-foreground\")),\n                            ),\n                    )\n                    .child(\n                        view()\n                            .app_class(cls(\"grid gap-2\"))\n                            .child(dimension(\"Width\", \"100%\"))\n                            .child(dimension(\"Max. width\", \"300px\"))\n                            .child(dimension(\"Height\", \"25px\"))\n                            .child(dimension(\"Max. height\", \"none\")),\n                    ),\n            ),\n        ),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/overlays.rs"}, {"id": "hover-card", "title": "Hover Card", "family": "Overlays", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/overlays/hover_card.rs", "shadcn": "https://ui.shadcn.com/docs/components/hover-card", "notes": ["`border` is `border border-border`.", "The animation classes are tw-animate-css's: they are the popup's starting and ending looks, with a 150 ms transition (`super::motion`), scaled about the side facing the trigger.", "`align`, `side` and `side_offset`, which shadcn gives `HoverCardContent`, are the root's props: the root places the card.", "`text-base` is added to the content: a portal's content inherits the page body's text (the browser's 16 px, on Tailwind's base line height 1.5), which NSH's text, 14 points by default, does not have."], "usage": "fn hover_card() -> View {\n    centered().child(\n        ui::hover_card().trigger(ui::button(\"@nextjs\").link()).child(\n            ui::hover_card_content().app_class(cls(\"w-80\")).child(\n                view()\n                    .app_class(cls(\"flex justify-between gap-4\"))\n                    // shadcn's Avatar with its fallback (the image is not\n                    // loaded: it would come from the network).\n                    .child(\n                        view()\n                            .app_class(cls(\n                                \"relative flex size-8 shrink-0 overflow-hidden rounded-full select-none\",\n                            ))\n                            .child(\n                                view()\n                                    .app_class(cls(\n                                        \"flex size-full items-center justify-center rounded-full \\\n                                         bg-muted text-sm text-muted-foreground\",\n                                    ))\n                                    .child(text(\"VC\")),\n                            ),\n                    )\n                    .child(\n                        // `shrink`: NSH's views do not shrink by default (CSS's\n                        // do), so the column would keep its text on one line\n                        // past the card.\n                        view()\n                            .app_class(cls(\"space-y-1 shrink\"))\n                            .child(text(\"@nextjs\").app_class(cls(\"text-sm font-semibold\")))\n                            .child(\n                                text(\"The React Framework – created and maintained by @vercel.\")\n                                    .app_class(cls(\"text-sm\")),\n                            )\n                            .child(\n                                text(\"Joined December 2021\")\n                                    .app_class(cls(\"text-xs text-muted-foreground\")),\n                            ),\n                    ),\n            ),\n        ),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/overlays.rs"}, {"id": "tooltip", "title": "Tooltip", "family": "Overlays", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/overlays/tooltip.rs", "shadcn": "https://ui.shadcn.com/docs/components/tooltip", "notes": ["`animate-in fade-in-0 zoom-in-95 data-[side=…]:slide-in-from-…-2` and the `animate-out` classes are tw-animate-css's: they are the tooltip's starting and ending looks, with a 150 ms transition between them (`super::motion`), scaled about the side facing the trigger.", "The arrow (Radix's `TooltipPrimitive.Arrow`, an SVG Radix places in a span at the content's edge) is a view of the content: its classes `size-2.5 rotate-45 rounded-[2px] bg-foreground`, and where Radix's span and `translate-y-[calc(-50%_-_2px)]` put it written out as `absolute` offsets (NSH has no `calc()` in translations); `fill-*` paints the SVG, which it is not.", "`side`, `align` and `side_offset`, which shadcn gives `TooltipContent`, are the root's props; Radix adds the arrow's height (5) to the offset, and so does this."], "usage": "fn tooltip() -> View {\n    centered().child(\n        ui::tooltip()\n            .trigger(ui::button(\"Hover\").outline())\n            .child(ui::tooltip_content(\"Add to library\")),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/overlays.rs"}, {"id": "sonner", "title": "Sonner", "family": "Overlays", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/overlays/sonner.rs", "shadcn": "https://ui.shadcn.com/docs/components/sonner", "notes": ["the toast: `padding: 16px`, `background: var(--normal-bg)`, `border: 1px solid var(--normal-border)`, `color: var(--normal-text)`, `border-radius: var(--border-radius)`, `box-shadow: 0 4px 12px rgba(0,0,0,.1)`, `width: 356px`, `font-size: 13px`, a row centered with `gap: 6px`;", "`[data-icon]`: 16 points, `margin: 0 4px 0 -3px`, its SVG `-1px`;", "`[data-content]`: a column, `gap: 2px`; `[data-title]` 500 on a 1.5 line; `[data-description]` 400 on a 1.4 line in `#3f3f3f` (`hsl(0 0% 91%)` in the dark theme);", "`[data-button]`: 24 points tall, `padding: 0 8px`, `border-radius: 4px`, 12 points, 500, the toast's text color as its background and its background as its text, at the end of the row (`margin-left: auto`);", "the toaster: fixed 24 points from its corner (16 below 600 points), 356 wide."], "usage": "fn sonner() -> View {\n    let outline = |name: &'static str| ui::button(name).outline();\n    centered()\n        .child(ui::toaster())\n        .child(outline(\"Show Toast\").on_press(|| {\n            ui::toast(\"Event has been created\")\n                .description(\"Sunday, December 03, 2023 at 9:00 AM\")\n                .action(\"Undo\", || {})\n                .show();\n        }))\n        .child(\n            view()\n                .app_class(cls(\"flex flex-row flex-wrap justify-center gap-2\"))\n                .child(outline(\"Default\").on_press(|| {\n                    ui::toast(\"Event has been created\").show();\n                }))\n                .child(outline(\"Success\").on_press(|| {\n                    ui::toast(\"Event has been created\").success().show();\n                }))\n                .child(outline(\"Info\").on_press(|| {\n                    ui::toast(\"Be at the area 10 minutes before the event time\").info().show();\n                }))\n                .child(outline(\"Warning\").on_press(|| {\n                    ui::toast(\"Event start time cannot be earlier than 8am\").warning().show();\n                }))\n                .child(outline(\"Error\").on_press(|| {\n                    ui::toast(\"Event has not been created\").error().show();\n                }))\n                .child(outline(\"Promise\").on_press(|| {\n                    let id = ui::toast(\"Loading...\").loading().show();\n                    // The timer runs on its own: dropping its handle does\n                    // not cancel it.\n                    drop(set_timeout(Duration::from_secs(2), move || {\n                        ui::toast(\"Event has been created\").success().id(id).show();\n                    }));\n                })),\n        )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/overlays.rs"}, {"id": "dropdown-menu", "title": "Dropdown Menu", "family": "Menus", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/menus/dropdown_menu.rs", "shadcn": "https://ui.shadcn.com/docs/components/dropdown-menu", "notes": ["`DropdownMenuContent` is the root's: its `className` is the `content_class` prop, on the view around the items inside the popup's border (nsh-base gives submenus their menu's popup classes, so a width on the popup would size every submenu too): `w-56` makes the content 2 points wider than shadcn's; its `side`, `align` and `sideOffset` the root's (`align` center and `sideOffset` 4 by default, as Radix's and shadcn's). `DropdownMenuPortal`, `DropdownMenuGroup` and `DropdownMenuRadioGroup` have no classes and no part here: items are the root's children in order, and a radio item says whether it is `checked`.", "`DropdownMenuSub` draws its `DropdownMenuSubTrigger` from its `label` and takes its `DropdownMenuSubContent`'s items as children. nsh-base gives a submenu's popup its menu's popup classes, so a submenu's popup has the content's `shadow-md` rather than `shadow-lg`, and its `content_class` (a width) goes on the view around its items, inside the popup's border.", "[`DropdownMenuTrigger`] is shadcn's `<DropdownMenuTrigger asChild>` around a `<Button>`: it draws Button's classes itself, as the trigger nsh-base's menu presses (a `Button` inside the trigger would take the presses itself)."], "usage": "/// `dropdown-menu-demo.tsx`.\nfn dropdown_menu() -> View {\n    let last = signal(SharedString::from(\"none\"));\n    let item = move |label: &'static str| {\n        ui::dropdown_menu_item(label).on_select(move || last.set(label.into()))\n    };\n    view()\n        .gap_4()\n        .items_start()\n        .child(\n            ui::dropdown_menu()\n                .align_start()\n                .content_class(Some(\"w-56\".into()))\n                .trigger(ui::dropdown_menu_trigger(\"Open\").outline())\n                .child(ui::dropdown_menu_label(\"My Account\"))\n                .child(item(\"Profile\").child(ui::dropdown_menu_shortcut(\"⇧⌘P\")))\n                .child(item(\"Billing\").child(ui::dropdown_menu_shortcut(\"⌘B\")))\n                .child(item(\"Settings\").child(ui::dropdown_menu_shortcut(\"⌘S\")))\n                .child(item(\"Keyboard shortcuts\").child(ui::dropdown_menu_shortcut(\"⌘K\")))\n                .child(ui::dropdown_menu_separator())\n                .child(item(\"Team\"))\n                .child(\n                    ui::dropdown_menu_sub(\"Invite users\")\n                        .child(item(\"Email\"))\n                        .child(item(\"Message\"))\n                        .child(ui::dropdown_menu_separator())\n                        .child(item(\"More...\")),\n                )\n                .child(item(\"New Team\").child(ui::dropdown_menu_shortcut(\"⌘+T\")))\n                .child(ui::dropdown_menu_separator())\n                .child(item(\"GitHub\"))\n                .child(item(\"Support\"))\n                .child(item(\"API\").disabled(true))\n                .child(ui::dropdown_menu_separator())\n                .child(item(\"Log out\").child(ui::dropdown_menu_shortcut(\"⇧⌘Q\"))),\n        )\n        .child(chosen(last))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/menus.rs"}, {"id": "context-menu", "title": "Context Menu", "family": "Menus", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/menus/context_menu.rs", "shadcn": "https://ui.shadcn.com/docs/components/context-menu", "notes": ["`ContextMenuTrigger` is the `trigger` slot: the app's view (shadcn's trigger has no classes of its own); `ContextMenuContent` is the root's (`content_class` is its `className`, on the view around the items inside the popup's border, as `dropdown_menu.rs` says: `w-52` is 2 points wider than shadcn's). nsh-base opens it 2 points below the pointer, its s
