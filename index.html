tart at the pointer (`offset` 2); Radix opens it 2 points right of the pointer, its top at the pointer (`side=\"right\" sideOffset={2}`): 2 points apart on each axis.", "`ContextMenuPortal`, `ContextMenuGroup` and `ContextMenuRadioGroup` have no classes and no part; a radio item says whether it is `checked`.", "`ContextMenuSub` draws its `ContextMenuSubTrigger` from its `label` and takes its `ContextMenuSubContent`'s items as children; its popup has the content's classes (`shadow-md`, not `shadow-lg`: nsh-base gives a submenu its menu's popup classes), its `content_class` the view around its items."], "usage": "/// `context-menu-demo.tsx`.\nfn context_menu() -> View {\n    let last = signal(SharedString::from(\"none\"));\n    let bookmarks = signal(true);\n    let urls = signal(false);\n    let person = signal(\"pedro\");\n    let item = move |label: &'static str| {\n        ui::context_menu_item(label).on_select(move || last.set(label.into()))\n    };\n    let radio = move |label: &'static str, value: &'static str| {\n        ui::context_menu_radio_item(label)\n            .checked(move || person.get() == value)\n            .on_select(move || person.set(value))\n    };\n    view()\n        .gap_4()\n        .items_start()\n        .child(\n            ui::context_menu()\n                .content_class(Some(\"w-52\".into()))\n                .trigger(\n                    view()\n                        .app_class(Some(SharedString::from(\n                            \"flex h-[150px] w-[300px] items-center justify-center rounded-md border \\\n                             border-border border-dashed text-sm\",\n                        )))\n                        .child(text(\"Right click here\")),\n                )\n                .child(item(\"Back\").inset(true).child(ui::context_menu_shortcut(\"⌘[\")))\n                .child(\n                    item(\"Forward\")\n                        .inset(true)\n                        .disabled(true)\n                        .child(ui::context_menu_shortcut(\"⌘]\")),\n                )\n                .child(item(\"Reload\").inset(true).child(ui::context_menu_shortcut(\"⌘R\")))\n                .child(\n                    ui::context_menu_sub(\"More Tools\")\n                        .inset(true)\n                        .content_class(Some(\"w-44\".into()))\n                        .child(item(\"Save Page...\"))\n                        .child(item(\"Create Shortcut...\"))\n                        .child(item(\"Name Window...\"))\n                        .child(ui::context_menu_separator())\n                        .child(item(\"Developer Tools\"))\n                        .child(ui::context_menu_separator())\n                        .child(item(\"Delete\").destructive()),\n                )\n                .child(ui::context_menu_separator())\n                .child(\n                    ui::context_menu_checkbox_item(\"Show Bookmarks\")\n                        .checked(bookmarks)\n                        .on_checked_change(move |on: &bool| bookmarks.set(*on)),\n                )\n                .child(\n                    ui::context_menu_checkbox_item(\"Show Full URLs\")\n                        .checked(urls)\n                        .on_checked_change(move |on: &bool| urls.set(*on)),\n                )\n                .child(ui::context_menu_separator())\n                .child(ui::context_menu_label(\"People\").inset(true))\n                .child(radio(\"Pedro Duarte\", \"pedro\"))\n                .child(radio(\"Colm Tuite\", \"colm\")),\n        )\n        .child(\n            text(move || {\n                format!(\n                    \"Chosen: {}, bookmarks {}, URLs {}, {}\",\n                    last.get(),\n                    if bookmarks.get() { \"on\" } else { \"off\" },\n                    if urls.get() { \"on\" } else { \"off\" },\n                    person.get()\n                )\n            })\n            .text_sm()\n            .text_color(move || theme().muted_foreground),\n        )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/menus.rs"}, {"id": "menubar", "title": "Menubar", "family": "Menus", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/menus/menubar.rs", "shadcn": "https://ui.shadcn.com/docs/components/menubar", "notes": ["`MenubarMenu` draws its `MenubarTrigger` from its `label` and takes its `MenubarContent`'s items as children (`content_class` is the content's `className`, on the view around the items, as `dropdown_menu.rs` says). The trigger's `data-[state=open]:` classes follow the menu's open state; its `focus:` classes are not drawn: nsh-base gives the trigger's keyboard focus to a node around the view a Rust component fills the trigger with.", "The content's `alignOffset` of -4 is `-translate-x-1` on the popup (nsh-base's `align` has no offset); its `sideOffset` is 8.", "`MenubarPortal`, `MenubarGroup` and `MenubarRadioGroup` have no classes and no part; a radio item says whether it is `checked`.", "`MenubarSub`'s popup has the content's classes (`min-w-[12rem] shadow-md`, not `min-w-[8rem] shadow-lg`: nsh-base gives a submenu its menu's popup classes)."], "usage": "/// `menubar-demo.tsx`.\nfn menubar() -> View {\n    let last = signal(SharedString::from(\"none\"));\n    let bookmarks = signal(false);\n    let urls = signal(true);\n    let profile = signal(\"benoit\");\n    let item = move |label: &'static str| {\n        ui::menubar_item(label).on_select(move || last.set(label.into()))\n    };\n    let radio = move |label: &'static str, value: &'static str| {\n        ui::menubar_radio_item(label)\n            .checked(move || profile.get() == value)\n            .on_select(move || profile.set(value))\n    };\n    let check = move |label: &'static str, on: Signal<bool>| {\n        ui::menubar_checkbox_item(label)\n            .checked(on)\n            .on_checked_change(move |now: &bool| on.set(*now))\n    };\n    view()\n        .gap_4()\n        .items_start()\n        .child(\n            ui::menubar()\n                .child(\n                    ui::menubar_menu(\"File\")\n                        .child(item(\"New Tab\").child(ui::menubar_shortcut(\"⌘T\")))\n                        .child(item(\"New Window\").child(ui::menubar_shortcut(\"⌘N\")))\n                        .child(item(\"New Incognito Window\").disabled(true))\n                        .child(ui::menubar_separator())\n                        .child(\n                            ui::menubar_sub(\"Share\")\n                                .child(item(\"Email link\"))\n                                .child(item(\"Messages\"))\n                                .child(item(\"Notes\")),\n                        )\n                        .child(ui::menubar_separator())\n                        .child(item(\"Print...\").child(ui::menubar_shortcut(\"⌘P\"))),\n                )\n                .child(\n                    ui::menubar_menu(\"Edit\")\n                        .child(item(\"Undo\").child(ui::menubar_shortcut(\"⌘Z\")))\n                        .child(item(\"Redo\").child(ui::menubar_shortcut(\"⇧⌘Z\")))\n                        .child(ui::menubar_separator())\n                        .child(\n                            ui::menubar_sub(\"Find\")\n                                .child(item(\"Search the web\"))\n                                .child(ui::menubar_separator())\n                                .child(item(\"Find...\"))\n                                .child(item(\"Find Next\"))\n                                .child(item(\"Find Previous\")),\n                        )\n                        .child(ui::menubar_separator())\n                        .child(item(\"Cut\"))\n                        .child(item(\"Copy\"))\n                        .child(item(\"Paste\")),\n                )\n                .child(\n                    ui::menubar_menu(\"View\")\n                        .child(check(\"Always Show Bookmarks Bar\", bookmarks))\n                        .child(check(\"Always Show Full URLs\", urls))\n                        .child(ui::menubar_separator())\n                        .child(item(\"Reload\").inset(true).child(ui::menubar_shortcut(\"⌘R\")))\n                        .child(\n                            item(\"Force Reload\")\n                                .inset(true)\n                                .disabled(true)\n                                .child(ui::menubar_shortcut(\"⇧⌘R\")),\n                        )\n                        .child(ui::menubar_separator())\n                        .child(item(\"Toggle Fullscreen\").inset(true))\n                        .child(ui::menubar_separator())\n                        .child(item(\"Hide Sidebar\").inset(true)),\n                )\n                .child(\n                    ui::menubar_menu(\"Profiles\")\n                        .child(radio(\"Andy\", \"andy\"))\n                        .child(radio(\"Benoit\", \"benoit\"))\n                        .child(radio(\"Luis\", \"luis\"))\n                        .child(ui::menubar_separator())\n                        .child(item(\"Edit...\").inset(true))\n                        .child(ui::menubar_separator())\n                        .child(item(\"Add Profile...\").inset(true)),\n                ),\n        )\n        .child(chosen(last))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/menus.rs"}, {"id": "select", "title": "Select", "family": "Menus", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/menus/select.rs", "shadcn": "https://ui.shadcn.com/docs/components/select", "notes": ["`transition-[color,box-shadow]` (an arbitrary property list NSH does not parse) is `transition`, which animates colors and shadows too.", "`w-fit` is the root's; `data-[size=…]:h-*` is the `size` prop's, `data-[placeholder]:text-muted-foreground` applies while nothing is chosen, `aria-invalid:` is the `invalid` prop's.", "`[&_svg]:…` size and color the chevron and the check themselves; `*:data-[slot=select-value]:line-clamp-1 …` is on the value's text.", "`focus-visible:` on the trigger is not drawn: nsh-base gives the trigger's keyboard focus to a node around the view a Rust component fills the trigger with.", "An item's `data-[highlighted]` is `focus:` (nsh-base projects it on the highlighted row), its `ItemIndicator` shows on `group-selected:`. The row's content is a view of its own (nsh-base's `renderItem`, in a holder nsh-base places in the row), which holds the indicator: the row adds `flex-col items-stretch` so the holder fills the row inside its `pr-8`, the content's own view is the row `flex items-center gap-2`, and the indicator's `right-2` from the row's edge is `-right-6` from the content's (an absolute view is placed in its parent).", "The content's `p-1` viewport is the list's (`list_class`); `SelectScrollUpButton` / `SelectScrollDownButton` are not drawn: the list scrolls natively. The animations are nsh-base's popup transitions (`menu_common.rs`), without a slide: item-aligned, Radix gives the content no side to slide from.", "`SelectSeparator` is not a part: nsh-base's select lists items and their sections' headers only."], "usage": "/// `select-demo.tsx`.\nfn select() -> View {\n    let value = signal(None::<SharedString>);\n    let fruits = [\n        (\"apple\", \"Apple\"),\n        (\"banana\", \"Banana\"),\n        (\"blueberry\", \"Blueberry\"),\n        (\"grapes\", \"Grapes\"),\n        (\"pineapple\", \"Pineapple\"),\n    ];\n    view()\n        .gap_4()\n        .items_start()\n        .child(\n            ui::select(\n                fruits\n                    .iter()\n                    .map(|(value, title)| ui::SelectItem::new(*value, *title).group(\"Fruits\"))\n                    .collect(),\n            )\n            .placeholder(\"Select a fruit\")\n            .accessibility_label(\"Fruit\")\n            .app_class(Some(SharedString::from(\"w-[180px]\")))\n            .on_value_change(move |next: &Option<SharedString>| value.set(next.clone())),\n        )\n        .child(\n            text(move || format!(\"Value: {}\", value.get().as_deref().unwrap_or(\"none\")))\n                .text_sm()\n                .text_color(move || theme().muted_foreground),\n        )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/menus.rs"}, {"id": "combobox", "title": "Combobox", "family": "Menus", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/menus/combobox.rs", "shadcn": "https://ui.shadcn.com/docs/components/combobox", "notes": ["`has-[[data-slot=input-group-control]:focus-visible]:…` on the group is `focus-within:…` (a text input shows `focus-visible` whenever it has the focus); the other `has-[…]` rules are applied where they hold (`pr-2` on the input beside an `inline-end` addon, the addon's `mr-[-0.45rem]` around a button); `group-data-[disabled=true]/…` and the input's `aria-invalid:` / `file:` classes are left out (no `disabled`, `invalid` or file input here).", "NSH has no `order-*` (the addon comes after the input anyway), `scroll-py-*` (scroll padding for keyboard scrolling) or `selection:text-*` (only the highlight's color): left out.", "`transition-[color,box-shadow]` is `transition`; `rounded-[calc(var(--radius)-5px)]` is `rounded-[5px]` (the radius is 10 points); `pointer-coarse:` sizes are left out.", "The content is at least as wide as the input group, nsh-base's popup at its anchor: Base UI's `w-(--anchor-width) min-w-[calc(var(--anchor-width)+--spacing(7))]` makes it the input's width (the group's less its addon) plus 28 points, about the group's, from the input's start. `max-w-(--available-width)` and the list's `max-h-[min(…)]` are nsh-base's room; `max-h-96` stays.", "An item's `data-highlighted:` is `focus:`, its `ItemIndicator` shows on `group-selected:`; the row adds `flex-col items-stretch` so the content nsh-base renders fills it, and the indicator's `right-2` from the row's edge is `-right-6` from that content (inside the row's `pr-8`). `ComboboxEmpty`'s `hidden … group-data-empty/…:flex` is `flex`: nsh-base shows it only while no item does. The animations are nsh-base's popup transitions (`menu_common.rs`).", "`multiple` with `ComboboxChips` is not ported: one value."], "usage": "/// The docs' combobox demo (`combobox-demo.tsx` of the Base UI styles,\n/// shadcn's `combobox.tsx`).\nfn combobox() -> View {\n    let value = signal(None::<SharedString>);\n    let frameworks = [\"Next.js\", \"SvelteKit\", \"Nuxt.js\", \"Remix\", \"Astro\"];\n    view()\n        .gap_4()\n        .items_start()\n        .child(\n            ui::combobox(frameworks.iter().map(|f| ui::SelectItem::new(*f, *f)).collect())\n                .placeholder(\"Select a framework\")\n                .empty(\"No items found.\")\n                .accessibility_label(\"Framework\")\n                .test_id(\"framework\")\n                .app_class(Some(SharedString::from(\"w-64\")))\n                .on_value_change(move |next: &Option<SharedString>| value.set(next.clone())),\n        )\n        .child(\n            text(move || format!(\"Value: {}\", value.get().as_deref().unwrap_or(\"none\")))\n                .text_sm()\n                .text_color(move || theme().muted_foreground),\n        )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/menus.rs"}, {"id": "command", "title": "Command", "family": "Menus", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/menus/command.rs", "shadcn": "https://ui.shadcn.com/docs/components/command", "notes": ["nsh-base's list has its rows flat (a heading, items, a separator), with no view per group: `CommandGroup`'s `p-1` is `mx-1` on each row, `mt-1` on a heading and a separator (the space above a group and below the one before) and `pb-1` on the list (below the last group); `[&_[cmdk-group-heading]]:…` are the heading's own classes. The separator's `-mx-1` is left out: the list's rows already span it.", "`data-[selected=true]:` (cmdk's highlighted item) is `focus:`, which nsh-base projects on the highlighted row while the field keeps the keyboard focus; `data-[disabled=true]:` is `disabled:`.", "`[&_svg]:…` size and color an item's icon; the search icon's classes are its own. A row adds `flex-col items-stretch` so the content nsh-base renders in it fills the row (its own view is the row's `flex items-center gap-2`), which a shortcut's `ml-auto` needs.", "The list's `scroll-py-1 overflow-x-hidden overflow-y-auto` are nsh-base's scroll view (NSH has no `scroll-py-*`); `max-h-[300px]` stays.", "The input adds `shrink`: a CSS flex item shrinks by default, an NSH one does not, and the input's `w-full` beside the search icon would run past the bar.", "The root's `h-full` is left out: NSH resolves a percentage height against a parent its content sizes (as Yoga does), so the command grew its list to its `max-h-[300px]` where a browser keeps it at its rows' height. An app sizes it with `h-*` where it should fill.", "`CommandDialog` is not part of this family (it is a `Dialog`, the overlays family's): put a `Command` in one."], "usage": "/// `command-demo.tsx`.\nfn command() -> View {\n    use ui::{CommandItem, IconName};\n    let last = signal(SharedString::from(\"none\"));\n    let items = vec![\n        CommandItem::new(\"calendar\", \"Calendar\").icon(IconName::Calendar).group(\"Suggestions\"),\n        CommandItem::new(\"emoji\", \"Search Emoji\").icon(IconName::Smile).group(\"Suggestions\"),\n        CommandItem::new(\"calculator\", \"Calculator\")\n            .icon(IconName::Calculator)\n            .group(\"Suggestions\")\n            .disabled(true),\n        CommandItem::new(\"profile\", \"Profile\").icon(IconName::User).shortcut(\"⌘P\").group(\"Settings\"),\n        CommandItem::new(\"billing\", \"Billing\")\n            .icon(IconName::CreditCard)\n            .shortcut(\"⌘B\")\n            .group(\"Settings\"),\n        CommandItem::new(\"settings\", \"Settings\")\n            .icon(IconName::Settings)\n            .shortcut(\"⌘S\")\n            .group(\"Settings\"),\n    ];\n    view()\n        .gap_4()\n        .items_start()\n        .child(\n            ui::command(items)\n                .placeholder(\"Type a command or search...\")\n                .empty(\"No results found.\")\n                .accessibility_label(\"Commands\")\n                .app_class(Some(SharedString::from(\n                    \"rounded-lg border border-border shadow-md md:min-w-[450px]\",\n                )))\n                .on_select(move |id: &SharedString| last.set(id.clone())),\n        )\n        .child(chosen(last))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/menus.rs"}, {"id": "navigation-menu", "title": "Navigation Menu", "family": "Menus", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/menus/navigation_menu.rs", "shadcn": "https://ui.shadcn.com/docs/components/navigation-menu", "notes": ["Radix opens an item's content when the pointer rests on its trigger and moves the open content along the bar with the pointer; here a press opens it (nsh-base's `Popover`), and the shared `Viewport` (`viewport={true}`, its size animating from one content to the next) and `NavigationMenuIndicator` are not ported.", "`NavigationMenuItem` draws its `NavigationMenuTrigger` from its `label` and takes its `NavigationMenuContent` as children (`content_class` is the content's `className`); an item without a `label` places its children as they are (a `NavigationMenuLink`).", "`data-[state=open]:` on the trigger, and `group-data-[state=open]:` on its chevron, follow the popover's open state, which nsh-base reports (`onOpenChange`): nsh-base gives the trigger's states to a node around the view a Rust component fills the trigger with, so the trigger's own `focus:` and `focus-visible:` classes are not drawn either.", "The content's `group-data-[viewport=false]/navigation-menu:…` classes are the popover's own; `top-full mt-1.5` is its offset of 6 below the trigger, `md:absolute md:w-auto top-0 left-0 w-full` is nsh-base's placement; `**:data-[slot=navigation-menu-link]:focus:…` (no descendant selectors) is left out. The `data-[motion=…]` slides between contents are not ported; the `fade-in-0 zoom-in-95` entrance and exit are nsh-base's popup transitions (`menu_common.rs`).", "The root's `max-w-max flex-1` (grow, but no wider than the items) is left out, which leaves it as wide as its items: NSH has no `max-w-max`.", "`list-none` (a `<ul>`'s bullets) and `outline-1` are left out: NSH has no list markers, and its focus ring is the `ring` classes. `transition-[color,box-shadow]` is `transition`.", "`NavigationMenuLink`'s `data-[active=true]:` is the `active` prop's; `[&_svg]:…` is the app's icon's own class (`size-4 text-muted-foreground`)."], "usage": "/// `navigation-menu-demo.tsx` (its desktop look: `viewport={false}`).\nfn navigation_menu() -> View {\n    use ui::IconName;\n    let last = signal(SharedString::from(\"none\"));\n    let link = move |title: &'static str| {\n        ui::navigation_menu_link().on_select(move || last.set(title.into()))\n    };\n    // `ListItem`: a title and two lines of description.\n    let list_item = move |title: &'static str, description: &'static str| {\n        view().child(\n            link(title)\n                .child(line(title, \"text-sm leading-none font-medium\"))\n                .child(line(description, \"line-clamp-2 text-sm leading-snug text-muted-foreground\")),\n        )\n    };\n    let components = [\n        (\"Alert Dialog\", \"A modal dialog that interrupts the user with important content and expects a response.\"),\n        (\"Hover Card\", \"For sighted users to preview content available behind a link.\"),\n        (\"Progress\", \"Displays an indicator showing the completion progress of a task, typically displayed as a progress bar.\"),\n        (\"Scroll-area\", \"Visually or semantically separates content.\"),\n        (\"Tabs\", \"A set of layered sections of content—known as tab panels—that are displayed one at a time.\"),\n        (\"Tooltip\", \"A popup that displays information related to an element when the element receives keyboard focus or the mouse hovers over it.\"),\n    ];\n    let mut components_grid = class(\"grid gap-2 sm:w-[400px] md:w-[500px] md:grid-cols-2 lg:w-[600px]\");\n    for (title, description) in components {\n        components_grid = components_grid.child(list_item(title, description));\n    }\n    let titled = move |title: &'static str, description: &'static str| {\n        link(title)\n            .child(line(title, \"font-medium\"))\n            .child(line(description, \"text-muted-foreground\"))\n    };\n    let with_icon = move |icon: IconName, title: &'static str| {\n        link(title)\n            .app_class(Some(SharedString::from(\"flex-row items-center gap-2\")))\n            .child(ui::icon(icon).app_class(Some(SharedString::from(\"size-4 text-muted-foreground\"))))\n            .child(text(title))\n    };\n    view()\n        .gap_4()\n        .items_start()\n        .child(\n            ui::navigation_menu().child(\n                ui::navigation_menu_list()\n                    .app_class(Some(SharedString::from(\"flex-wrap\")))\n                    .child(\n                        ui::navigation_menu_item(\"Home\").child(\n                            class(\"grid gap-2 md:w-[400px] lg:w-[500px] lg:grid-cols-[.75fr_1fr]\")\n                                .child(\n                                    class(\"row-span-3\").child(\n                                        link(\"shadcn/ui\")\n                                            .app_class(Some(SharedString::from(\n                                                \"flex h-full w-full flex-col justify-end rounded-md \\\n                                                 bg-linear-to-b from-muted/50 to-muted p-4 outline-hidden \\\n                                                 transition-all duration-200 select-none focus:shadow-md md:p-6\",\n                                            )))\n                                            .child(line(\"shadcn/ui\", \"mb-2 text-lg font-medium sm:mt-4\"))\n                                            .child(line(\n                                                \"Beautifully designed components built with Tailwind CSS.\",\n                                                \"text-sm leading-tight text-muted-foreground\",\n                                            )),\n                                    ),\n                                )\n                                .child(list_item(\n                                    \"Introduction\",\n                                    \"Re-usable components built using Radix UI and Tailwind CSS.\",\n                                ))\n                                .child(list_item(\n                                    \"Installation\",\n                                    \"How to install dependencies and structure your app.\",\n                                ))\n                                .child(list_item(\n                                    \"Typography\",\n                                    \"Styles for headings, paragraphs, lists...etc\",\n                                )),\n                        ),\n                    )\n                    .child(ui::navigation_menu_item(\"Components\").child(components_grid))\n                    .child(\n                        ui::navigation_menu_link_item().child(\n                            link(\"Docs\")\n                                .app_class(Some(SharedString::from(ui::NAVIGATION_MENU_TRIGGER_STYLE)))\n                                .child(text(\"Docs\")),\n                        ),\n                    )\n                    .child(\n                        ui::navigation_menu_item(\"List\").child(\n                            class(\"grid w-[300px] gap-4\").child(\n                                view()\n                                    .child(titled(\"Components\", \"Browse all components in the library.\"))\n                                    .child(titled(\"Documentation\", \"Learn how to use the library.\"))\n                                    .child(titled(\"Blog\", \"Read our latest blog posts.\")),\n                            ),\n                        ),\n                    )\n                    .child(\n                        ui::navigation_menu_item(\"Simple\").child(\n                            class(\"grid w-[200px] gap-4\").child(\n                                view()\n                                    .child(link(\"Components\").child(text(\"Components\")))\n                                    .child(link(\"Documentation\").child(text(\"Documentation\")))\n                                    .child(link(\"Blocks\").child(text(\"Blocks\"))),\n                            ),\n                        ),\n                    )\n                    .child(\n                        ui::navigation_menu_item(\"With Icon\").child(\n                            class(\"grid w-[200px] gap-4\").child(\n                                view()\n                                    .child(with_icon(IconName::CircleHelp, \"Backlog\"))\n                                    .child(with_icon(IconName::Circle, \"To Do\"))\n                                    .child(with_icon(IconName::CircleCheck, \"Done\")),\n                            ),\n                        ),\n                    ),\n            ),\n        )\n        .child(chosen(last))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/menus.rs"}, {"id": "tabs", "title": "Tabs", "family": "Layout", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/layout/tabs.rs", "shadcn": "https://ui.shadcn.com/docs/components/tabs", "notes": ["`group-data-[orientation=…]/tabs:` and `group-data-[variant=…]/tabs-list:` read the root's orientation and the list's variant; the component knows both, so it picks the classes of the one it has.", "`data-[state=active]:` is `selected:` (the tab's selected state).", "`after:` draws the line variant's underline; NSH has no pseudo-elements, so the underline is a child of the trigger with the `after:` classes, shown by `group-selected:opacity-100`.", "In the line variant, `group-data-[variant=line]/tabs-list:data-[state=active]:bg-transparent` wins over `data-[state=active]:bg-background` in CSS by its specificity; here the line variant's classes come after the others, so they win by their place.", "`[&_svg]:…` sizes the `icon` prop's icon (`size-4`).", "`h-[calc(100%-1px)]` (NSH has no `calc()` in lengths) is `h-[29px]` in a row, the list's 36 points less its padding and the point; in a column, where the list fits its tabs, the tab's own height.", "`flex-1` is `flex-auto`: in a list that fits its tabs (`w-fit`) a browser resolves `flex-1`'s `0%` basis as the tab's content, so each tab keeps its width; NSH's `flex-1` would make them equal.", "`focus-visible:outline-1 focus-visible:outline-ring`: NSH draws an outline as CSS does."], "usage": "fn tabs_page() -> View {\n    let account = card()\n        .child(card_header(\n            \"Account\",\n            \"Make changes to your account here. Click save when you're done.\",\n        ))\n        .child(\n            div(\"grid gap-6 px-6\")\n                .child(field(\"Name\", \"Pedro Duarte\", false))\n                .child(field(\"Username\", \"@peduarte\", false)),\n        )\n        .child(div(\"flex items-center px-6\").child(ui::button(\"Save changes\")));\n    let password = card()\n        .child(card_header(\n            \"Password\",\n            \"Change your password here. After saving, you'll be logged out.\",\n        ))\n        .child(\n            div(\"grid gap-6 px-6\")\n                .child(field(\"Current password\", \"\", true))\n                .child(field(\"New password\", \"\", true)),\n        )\n        .child(div(\"flex items-center px-6\").child(ui::button(\"Save password\")));\n    view()\n        .flex_row()\n        .items_start()\n        .gap_8()\n        .child(\n            div(\"flex w-full max-w-sm flex-col gap-6\").child(\n                ui::tabs(\"account\")\n                    .child(\n                        ui::tabs_list()\n                            .child(ui::tabs_trigger(\"account\", \"Account\"))\n                            .child(ui::tabs_trigger(\"password\", \"Password\")),\n                    )\n                    .child(ui::tabs_content(\"account\").child(account))\n                    .child(ui::tabs_content(\"password\").child(password)),\n            ),\n        )\n        .child(\n            view()\n                .gap_8()\n                .child(example(\n                    \"Line\",\n                    ui::tabs(\"overview\").child(\n                        ui::tabs_list()\n                            .line()\n                            .child(ui::tabs_trigger(\"overview\", \"Overview\"))\n                            .child(ui::tabs_trigger(\"analytics\", \"Analytics\"))\n                            .child(ui::tabs_trigger(\"reports\", \"Reports\")),\n                    ),\n                ))\n                .child(example(\n                    \"Vertical\",\n                    ui::tabs(\"general\").vertical().child(\n                        ui::tabs_list()\n                            .child(ui::tabs_trigger(\"general\", \"General\"))\n                            .child(ui::tabs_trigger(\"security\", \"Security\"))\n                            .child(ui::tabs_trigger(\"billing\", \"Billing\").disabled(true)),\n                    ),\n                )),\n        )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/layout.rs"}, {"id": "accordion", "title": "Accordion", "family": "Layout", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/layout/accordion.rs", "shadcn": "https://ui.shadcn.com/docs/components/accordion", "notes": ["`border-b` is `border-b border-border` (NSH has no global border color).", "`[&[data-state=open]>svg]:rotate-180` is the chevron's `group-aria-expanded:rotate-180`, the trigger a `group`.", "`data-[state=closed]:animate-accordion-up` / `data-[state=open]:animate-accordion-down` (keyframes NSH does not have) is the panel's `reveal`: its clipped height springs open and shut.", "Radix's `type=\"single\" | \"multiple\"` is the `multiple` prop.", "shadcn passes `AccordionContent`'s `className` to the inner `div`; here that is the `content_class` prop (the element's own classes style the panel)."], "usage": "fn accordion_page() -> View {\n    view().child(accordion_demo())\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/layout.rs"}, {"id": "collapsible", "title": "Collapsible", "family": "Layout", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/layout/collapsible.rs", "shadcn": "https://ui.shadcn.com/docs/components/collapsible", "notes": ["`CollapsibleTrigger asChild` around a `Button` is the trigger with a button's look: its `variant`, `size`, `icon` and `label` are `Button`'s (`button.tsx`'s classes); without a `variant` it has no look of its own. NSH gives a press to the innermost view that takes presses, so a trigger cannot wrap a button that presses itself.", "Radix hides the closed content (`hidden`); here it is out of the layout while closed, so a `gap` around it leaves no room.", "`nsh_base`'s `Collapsible` places the content in a view of its own: shadcn's `className` of `CollapsibleContent`, which lays the content out, is the `content_class` prop (the element's own classes style the region around it)."], "usage": "fn collapsible_page() -> View {\n    let open = signal(false);\n    view().items_start().child(\n        ui::collapsible()\n            .open(move || Some(open.get()))\n            .on_open_change(move |next: &bool| open.set(*next))\n            .app_class(Some(\"flex w-[350px] flex-col gap-2\".into()))\n            .child(\n                div(\"flex items-center justify-between gap-4 px-4\")\n                    .child(span(\"@peduarte starred 3 repositories\", \"text-sm font-semibold\"))\n                    .child(\n                        ui::collapsible_trigger()\n                            .variant(Some(ui::ButtonVariant::Ghost))\n                            .size(ui::ButtonSize::Icon)\n                            .icon(Some(ui::IconName::ChevronsUpDown))\n                            .accessibility_label(Some(\"Toggle\".into()))\n                            .app_class(Some(\"size-8\".into())),\n                    ),\n            )\n            .child(repo(\"@radix-ui/primitives\"))\n            .child(\n                ui::collapsible_content()\n                    .content_class(Some(\"flex flex-col gap-2\".into()))\n                    .child(repo(\"@radix-ui/colors\"))\n                    .child(repo(\"@stitches/react\")),\n            ),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/layout.rs"}, {"id": "scroll-area", "title": "Scroll Area", "family": "Layout", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/layout/scroll_area.rs", "shadcn": "https://ui.shadcn.com/docs/components/scroll-area", "notes": ["Radix places the bar with inline styles (`position: absolute; top: 0; right: 0; bottom: 0`, `overflow: hidden` on the root); those are classes here (`absolute inset-y-0 right-0`, `overflow-hidden`).", "The viewport's `rounded-[inherit]` is the root's clip.", "A scroll view scrolls along one axis: shadcn's `<ScrollBar orientation=\"horizontal\" />` child is the area's `orientation=\"horizontal\"`, which scrolls sideways and draws that bar. The area draws its bar itself; the app adds none.", "Radix's `type` is `scroll_type`; `hover` (the default) shows the bar while the pointer is over the area or it scrolls.", "`transition-[color,box-shadow]` (NSH has no arbitrary transition properties) is `transition`, which animates colors and shadows.", "`touch-none` is left out: the bar claims the touches on it itself.", "Radix's thumb is at least 18 points long (`min_thumb_length`)."], "usage": "fn scroll_area_page() -> View {\n    let mut tags = div(\"p-4\").child(span(\"Tags\", \"mb-4 text-sm leading-none font-medium\"));\n    for i in (1..=50).rev() {\n        tags = tags\n            .child(span(format!(\"v1.2.0-beta.{i}\"), \"text-sm\"))\n            .child(div(\"shrink-0 bg-border h-px w-full my-2\"));\n    }\n    let mut works = div(\"flex w-max flex-row gap-4 p-4\");\n    for artist in [\"Ornella Binni\", \"Tom Byrom\", \"Vladimir Malyavko\"] {\n        works = works.child(\n            div(\"shrink-0\")\n                .child(\n                    div(\"overflow-hidden rounded-md\")\n                        .child(\n                            div(\"flex h-[400px] w-[300px] items-center justify-center bg-muted\")\n                                .child(ui::icon(ui::IconName::Image).app_class(Some(\n                                    \"size-8 text-muted-foreground\".into(),\n                                ))),\n                        ),\n                )\n                .child(\n                    span(\"Photo by \", \"pt-2 text-xs text-muted-foreground\")\n                        .child(span(artist, \"font-semibold text-foreground\")),\n                ),\n        );\n    }\n    view()\n        .flex_row()\n        .items_start()\n        .gap_8()\n        .child(\n            ui::scroll_area()\n                .app_class(Some(\"h-72 w-48 rounded-md border border-border\".into()))\n                .child(tags),\n        )\n        .child(\n            ui::scroll_area()\n                .horizontal()\n                .app_class(Some(\"w-96 rounded-md border border-border whitespace-nowrap\".into()))\n                .child(works),\n        )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/layout.rs"}, {"id": "resizable", "title": "Resizable", "family": "Layout", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/layout/resizable.rs", "shadcn": "https://ui.shadcn.com/docs/components/resizable", "notes": ["The handles are the group's: `nsh_base` places one over each boundary between two panels, a band that takes the drag, and draws shadcn's `ResizableHandle` classes as its line; `withHandle` (the grip) is the group's `with_handle`. A handle takes no room of its own (shadcn's is a 1-point flex item).", "`aria-[orientation=vertical]:` / `aria-[orientation=horizontal]:` are the group's `orientation`, which the component knows.", "`after:` (the handle's wider hit area) is the band's own.", "`[&[aria-orientation=horizontal]>div]:rotate-90` turns the grip in a vertical group.", "`border` is `border border-border`.", "react-resizable-panels sizes panels in percents of the group: `default_size` is a percent, as theirs; `min_size` and `max_size` are points (`nsh_base`'s), `0` and none by default."], "usage": "fn resizable_page() -> View {\n    let demo = ui::resizable_panel_group()\n        .app_class(Some(\"max-w-md rounded-lg border border-border md:min-w-[450px]\".into()))\n        .child(ui::resizable_panel(50.0).child(pane(\"One\", \"flex h-[200px] items-center justify-center p-6\")))\n        .child(\n            ui::resizable_panel(50.0).child(\n                ui::resizable_panel_group()\n                    .vertical()\n                    .child(\n                        ui::resizable_panel(25.0)\n                            .child(pane(\"Two\", \"flex h-full items-center justify-center p-6\")),\n                    )\n                    .child(\n                        ui::resizable_panel(75.0)\n                            .child(pane(\"Three\", \"flex h-full items-center justify-center p-6\")),\n                    ),\n            ),\n        );\n    let handle = ui::resizable_panel_group()\n        .with_handle(true)\n        .app_class(Some(\"min-h-[200px] max-w-md rounded-lg border border-border md:min-w-[450px]\".into()))\n        .child(ui::resizable_panel(25.0).child(pane(\"Sidebar\", \"flex h-full items-center justify-center p-6\")))\n        .child(ui::resizable_panel(75.0).child(pane(\"Content\", \"flex h-full items-center justify-center p-6\")));\n    view()\n        .gap_8()\n        .child(example(\"Default\", demo))\n        .child(example(\"With handle\", handle))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/layout.rs"}, {"id": "sidebar", "title": "Sidebar", "family": "Layout", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/layout/sidebar.rs", "shadcn": "https://ui.shadcn.com/docs/components/sidebar", "notes": ["`group-data-[collapsible=…]`, `group-data-[variant=…]`, `group-data-[side=…]` and `peer-data-[…]` read the sidebar's state, which its parts know through context: each picks the classes of the state it is in.", "The CSS variables are written out (NSH has no `calc()`): `w-(--sidebar-width)` is `w-[256px]` (16rem), `--sidebar-width-icon` 48 points, `calc(var(--sidebar-width-icon)+(--spacing(4)))` 64 and its `+2px` 66, `left-[calc(var(--sidebar-width)*-1)]` `left-[-256px]`.", "The sidebar's container is `fixed inset-y-0 h-svh` in shadcn: placed in the window. Here it is `absolute inset-y-0` in the sidebar, so the sidebar sits where its provider is laid out, and the provider clips (`overflow-hidden`) the sidebar that slides off the canvas.", "`md:block` / `md:flex` (the desktop layout) are always on: there is no mobile sheet (shadcn's `Sheet` under 768 points) and no `isMobile`.", "`transition-[width]`, `transition-[left,right,width]`, `transition-[margin,opacity]` and `transition-[width,height,padding]`: NSH's transitions do not animate layout, so the widths, margins and paddings change at once; the label's `opacity` fades (`transition`).", "`size-8!`, `p-2!`, `p-0!` of a collapsed sidebar's buttons are these classes' `!` forms.", "The outline button's `shadow-[0_0_0_1px_var(--sidebar-border)]` is `ring-1 ring-sidebar-border` (the same 1-point ring).", "`border` (the global border color) is `border-border`.", "`[&>svg]:size-4` and `[&>span:last-child]:truncate` are the button's `icon` (`size-4 shrink-0`) and its label's `truncate` (with `min-w-0 shrink`: NSH's flex items do not shrink by default).", "`SidebarMenuButton`'s `tooltip` (shown while collapsed) is left out: tooltips are another family's.", "`peer`, `peer/menu-button` and the menu action's `group-has-*` are left out: NSH has no `peer-*` variants (the parts read the state instead).", "`min-h-svh` is the provider's, as shadcn's; an app that places it in a box gives it the box's height (`.app_class(\"!min-h-0 h-full\")`: a later `min-h-0` alone does not win over `min-h-svh` in NSH)."], "usage": "fn sidebar_page() -> View {\n    use ui::IconName as I;\n    let items = [\n        (\"Home\", I::House),\n        (\"Inbox\", I::Inbox),\n        (\"Calendar\", I::Calendar),\n        (\"Search\", I::Search),\n        (\"Settings\", I::Settings),\n    ];\n    let mut menu = ui::sidebar_menu();\n    for (i, (label, icon)) in items.into_iter().enumerate() {\n        menu = menu.child(\n            ui::sidebar_menu_item()\n                .child(ui::sidebar_menu_button(label).icon(Some(icon)).is_active(i == 0)),\n        );\n    }\n    let sidebar = ui::sidebar()\n        .variant(ui::SidebarVariant::Inset)\n        .collapsible(ui::SidebarCollapsible::Icon)\n        .child(\n            ui::sidebar_header().child(\n                ui::sidebar_menu().child(\n                    ui::sidebar_menu_item().child(\n                        ui::sidebar_menu_button(\"Acme Inc\")\n                            .label(None)\n                            .size(ui::SidebarMenuButtonSize::Lg)\n                            .child(\n                                div(\n                                    \"flex aspect-square size-8 items-center justify-center rounded-lg \\\n                                     bg-sidebar-primary text-sidebar-primary-foreground\",\n                                )\n                                .child(ui::icon(I::GalleryVerticalEnd)),\n                            )\n                            .child(\n                                div(\"flex flex-1 flex-col text-left text-sm leading-tight\")\n                                    .child(span(\"Acme Inc\", \"truncate font-medium\"))\n                                    .child(span(\"Enterprise\", \"truncate text-xs\")),\n                            )\n                            .child(ui::icon(I::ChevronsUpDown).app_class(Some(\"ml-auto\".into()))),\n                    ),\n                ),\n            ),\n        )\n        .child(\n            ui::sidebar_content().child(\n                ui::sidebar_group()\n                    .child(ui::sidebar_group_label(\"Application\"))\n                    .child(ui::sidebar_group_content().child(menu)),\n            ),\n        )\n        .child(ui::sidebar_separator())\n        .child(\n            ui::sidebar_footer().child(\n                ui::sidebar_menu().child(\n                    ui::sidebar_menu_item()\n                        .child(ui::sidebar_menu_button(\"shadcn\").icon(Some(I::User))),\n                ),\n            ),\n        );\n    let inset = ui::sidebar_inset()\n        .child(\n            div(\"flex h-16 shrink-0 items-center gap-2 px-4\")\n                .child(ui::sidebar_trigger().app_class(Some(\"-ml-1 size-7\".into())))\n                .child(div(\"mr-2 h-4 w-px shrink-0 bg-border\"))\n                .child(span(\"Dashboard\", \"text-sm text-foreground\")),\n        )\n        .child(\n            div(\"flex flex-1 flex-col gap-4 p-4 pt-0\")\n                .child(\n                    div(\"grid auto-rows-min gap-4 grid-cols-3\")\n                        .child(div(\"aspect-video rounded-xl bg-muted/50\"))\n                        .child(div(\"aspect-video rounded-xl bg-muted/50\"))\n                        .child(div(\"aspect-video rounded-xl bg-muted/50\")),\n                )\n                .child(div(\"flex-1 rounded-xl bg-muted/50\")),\n        );\n    view().child(\n        ui::sidebar_provider()\n            .app_class(Some(\"!min-h-0 h-[508px] rounded-lg border border-border\".into()))\n            .child(sidebar)\n            .child(inset),\n    )\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/layout.rs"}, {"id": "carousel", "title": "Carousel", "family": "Layout", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/layout/carousel.rs", "shadcn": "https://ui.shadcn.com/docs/components/carousel", "notes": ["Embla's options: `opts.loop` is `looping`; Embla's `align` is always `start` (each slide snaps to the start of the viewport); `setApi`'s `select` event is `onSelect`, with the slide's index.", "shadcn passes `CarouselContent`'s `className` to its inner track; here that is the `content_class` prop (the element's own classes style the `overflow-hidden` viewport around it).", "A vertical slide is `min-h-auto`: a browser's flex items are at least as tall as their content (`min-height: auto`), NSH's views are not; shadcn's vertical example's cards are taller than their `basis-1/2`.", "The previous and next buttons are `Button`'s `outline` / `icon` classes (`button.tsx`) and shadcn's; the arrow is the `icon`'s `size-4`; `sr-only` text is the buttons' accessibility label."], "usage": "fn carousel_page() -> View {\n    let mut items = ui::carousel_content();\n    for i in 0..5 {\n        items = items.child(ui::carousel_item().child(slide(\n            i,\n            \"flex aspect-square items-center justify-center p-6\",\n            \"text-4xl font-semibold\",\n        )));\n    }\n    let demo = ui::carousel()\n        .accessibility_label(Some(\"Demo\".into()))\n        .app_class(Some(\"w-full max-w-xs\".into()))\n        .child(items)\n        .child(ui::carousel_previous())\n        .child(ui::carousel_next());\n    let mut items = ui::carousel_content().content_class(Some(\"-mt-1 h-[200px]\".into()));\n    for i in 0..5 {\n        items = items.child(\n            ui::carousel_item()\n                .app_class(Some(\"pt-1 md:basis-1/2\".into()))\n                .child(slide(i, \"flex items-center justify-center p-6\", \"text-3xl font-semibold\")),\n        );\n    }\n    let vertical = ui::carousel()\n        .vertical()\n        .accessibility_label(Some(\"Orientation\".into()))\n        .app_class(Some(\"w-full max-w-xs\".into()))\n        .child(items)\n        .child(ui::carousel_previous())\n        .child(ui::carousel_next());\n    view()\n        .flex_row()\n        .items_start()\n        .child(div(\"flex w-[416px] flex-col items-center px-12\").child(demo))\n        .child(div(\"flex w-[400px] flex-col items-center py-12\").child(vertical))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/layout.rs"}, {"id": "calendar", "title": "Calendar", "family": "Layout", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/layout/calendar.rs", "shadcn": "https://ui.shadcn.com/docs/components/calendar", "notes": ["`--cell-size` (`--spacing(8)`) is written out: `size-8`, `h-8`, `min-w-8`.", "`nsh_base` gives every item one class (`itemClass`): a day cell's classes (react-day-picker's `day`, `today`, `outside`, `range_*`) are its `data-today:`, `data-outside:`, `data-range-*:` and `selected:` classes, and what is inside each item (the day's button, a weekday's label, the arrows, the caption) is drawn by kind, with `group-*:` classes for the cell's states (`group-hover:` for the ghost button's `hover:`, `group-selected:` for `data-[selected-single=true]:`).", "The header is `nsh_base`'s row of Previous, the caption and Next (react-day-picker's `nav` is placed over the caption): the arrows go to its ends with `first:mr-auto` / `last:ml-auto`, the caption between. With several months their captions sit side by side in the middle rather than over each month.", "The caption's month and year are `nsh_base`'s toggles, which open its month and year views (react-day-picker's caption is a label); with `caption_layout=\"dropdown\"` they are drawn as shadcn's dropdowns (`dropdown_root`, `caption_label`), and they open those views in place of a native `<select>`.", "`nsh_base` gives the weekdays' row the weeks' class (`mt-2 flex w-full`, its `flex` left out: `nsh_base` lays the rows out and hides the weeks a month does not use); the month's `-mt-2` takes the weekdays' margin back.", "The weekday's `text-[0.8rem]` inherits the page's `leading-normal` in a browser; here it says so.", "The month and year views (`nsh_base`'s, not react-day-picker's) are drawn as ghost buttons, the shown one `bg-primary`.", "`showOutsideDays={false}` hides them (`data-outside:invisible`)."], "usage": "fn calendar_page() -> View {\n    // June 12, 2025, and June 9 to 26: a month far from today, so the\n    // pictures do not change with the day they are taken.\n    let single = ui::calendar()\n        .default_selected(ui::Date::Single(june(12)))\n        .caption_layout(ui::CalendarCaptionLayout::Dropdown)\n        .app_class(Some(\"rounded-md border border-border shadow-sm\".into()));\n    let range = ui::calendar()\n        .mode(ui::CalendarMode::Range)\n        .default_selected(ui::Date::Range(june(9), june(26)))\n        .app_class(Some(\"rounded-lg border border-border\".into()));\n    view()\n        .flex_row()\n        .items_start()\n        .gap_8()\n        .child(example(\"Single\", single))\n        .child(example(\"Range\", range))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/layout.rs"}, {"id": "chart", "title": "Chart", "family": "Layout", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/layout/chart.rs", "shadcn": "https://ui.shadcn.com/docs/components/chart", "notes": ["`ChartContainer` is recharts' chart too: it holds the rows, the scales, the grid (`<CartesianGrid vertical={false} />`), the x axis (`<XAxis tickLine={false} axisLine={false} tickMargin={10} />`), the tooltip (`<ChartTooltip content={<ChartTooltipContent />} />`) and the legend (`<ChartLegend content={<ChartLegendContent />} />`) as props; its children are the marks. It is a column (`flex-col`), the legend under the plot, as recharts lays its legend out inside the chart's box.", "Its descendant selectors (`[&_.recharts-cartesian-axis-tick_text]:fill-muted-foreground`, `[&_.recharts-cartesian-grid_line[stroke='#ccc']]:stroke-border/50`, `[&_.recharts-rectangle.recharts-tooltip-cursor]:fill-muted`, `[&_.recharts-curve.recharts-tooltip-cursor]:stroke-border`, `[&_.recharts-dot[stroke='#fff']]:stroke-transparent`) are the classes of those parts: the axis labels' `text-muted-foreground`, the grid's `stroke-border/50`, the cursor's `bg-muted` (a band) or `bg-border` (a line), the hover dot without a ring.", "`ChartConfig`'s CSS variables (`--color-desktop`) are the series' `color`: a theme color (`chart-1`) or a hex color (`#2563eb`), which the parts name in their classes (`bg-chart-1`, `bg-[#2563eb]`).", "recharts' margins (5 points, the x axis 30 high, the legend's height) are the plot's margins.", "A band's cursor (`fill-muted` behind the bars) is a view of the container's under the marks: `nsh_base`'s cross line is drawn over them. A point's cursor is the cross line.", "The tooltip goes beside the pointer, 10 points from it, as recharts' does."], "usage": "fn chart_page() -> View {\n    let labels: Vec<SharedString> = MONTH_NAMES.iter().map(|m| SharedString::from(*m)).collect();\n    let short: Vec<SharedString> = MONTH_NAMES.iter().map(|m| SharedString::from(&m[..3])).collect();\n    let ticks = vec![0.0, 80.0, 160.0, 240.0, 320.0];\n    let bars = ui::chart_container(vec![\n        ui::ChartConfigItem::new(\"desktop\", \"Desktop\", \"chart-1\"),\n        ui::ChartConfigItem::new(\"mobile\", \"Mobile\", \"chart-2\"),\n    ])\n    .data(chart_rows())\n    .labels(labels.clone())\n    .x_axis_labels(Some(short.clone()))\n    .x_scale(Some(ui::chart_band_scale()))\n    .y_scale(Some(ui::chart_linear_scale(0.0, 320.0)))\n    .grid(ticks.clone())\n    .legend(true)\n    .accessibility_label(Some(\"Bar chart\".into()))\n    .app_class(Some(\"w-full\".into()))\n    .child(ui::chart_bar(\"desktop\", \"chart-1\"))\n    .child(ui::chart_bar(\"mobile\", \"chart-2\"));\n    let area = ui::chart_container(vec![ui::ChartConfigItem::new(\"desktop\", \"Desktop\", \"chart-1\")])\n        .data(chart_rows())\n        .labels(labels)\n        .x_axis_labels(Some(short))\n        .y_scale(Some(ui::chart_linear_scale(0.0, 320.0)))\n        .grid(ticks)\n        .cursor(false)\n        .tooltip_indicator(ui::ChartTooltipIndicator::Line)\n        .margin_x(px(12.0))\n        .accessibility_label(Some(\"Area chart\".into()))\n        .app_class(Some(\"w-full\".into()))\n        .child(ui::chart_area(\"desktop\", \"chart-1\"));\n    let item = ui::ChartTooltipItem::new;\n    let tooltips = view()\n        .flex_row()\n        .items_start()\n        .gap_8()\n        .child(\n            ui::chart_tooltip_content()\n                .label(Some(\"Page Views\".into()))\n                .items(vec![item(\"Desktop\", 186.0, \"chart-1\"), item(\"Mobile\", 80.0, \"chart-2\")])\n                .app_class(Some(\"w-[8rem]\".into())),\n        )\n        .child(\n            ui::chart_tooltip_content()\n                .label(Some(\"Browser\".into()))\n                .hide_label(true)\n                .indicator(ui::ChartTooltipIndicator::Dashed)\n                .items(vec![item(\"Chrome\", 1286.0, \"chart-3\"), item(\"Firefox\", 1000.0, \"chart-4\")])\n                .app_class(Some(\"w-[8rem]\".into())),\n        )\n        .child(\n            ui::chart_tooltip_content()\n                .label(Some(\"Page Views\".into()))\n                .indicator(ui::ChartTooltipIndicator::Line)\n                .items(vec![item(\"Desktop\", 12486.0, \"chart-3\")])\n                .app_class(Some(\"w-[9rem]\".into())),\n        )\n        .child(\n            ui::chart_tooltip_content()\n                .label(Some(\"Browser\".into()))\n                .hide_label(true)\n                .items(vec![item(\"Chrome\", 1286.0, \"chart-1\")])\n                .app_class(Some(\"w-[8rem]\".into())),\n        );\n    view()\n        .gap_8()\n        .child(\n            view()\n                .flex_row()\n                .gap_8()\n                .child(section(\"Bar chart\", div(\"w-[392px]\").child(bars)))\n                .child(section(\"Area chart\", div(\"w-[392px]\").child(area))),\n        )\n        .child(section(\"Tooltip\", tooltips))\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/layout.rs"}, {"id": "message", "title": "Message", "family": "Chat", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/chat/message.rs", "shadcn": "https://ui.shadcn.com/docs/components/message", "notes": ["`data-[align=end]:…` and `group-data-[align=end]/message:…` are `data-align-end:…` and `group-data-align-end/message:…`: NSH has the boolean `data-*` form only, so a message projects `align-end` while its `align` is `end`.", "`group-has-data-[slot=message-footer]/message:…` (the avatar moves up past a footer) and `group-has-data-[variant=ghost]/message:…` (header and footer lose their padding beside a ghost bubble) are `group-data-has-footer/message:…` and `group-data-has-ghost/message:…`: NSH has no `has-*` variants, so a [`MessageFooter`] and a ghost [`super::Bubble`] tell the message around them, which projects `has-footer` / `has-ghost`.", "`group-data-[align=end]/message:*:data-slot:self-end` (every part in the content goes to the end) is `group-data-align-end/message:items-end` on the content: NSH has no child selectors. The parts are the content's children, so they go to the end alike; a child that is not one of this library's parts goes to the end too.", "`wrap-break-word` is left out: NSH has no such class."], "usage": "/// shadcn's `message-demo`, and `message-attachment` beside it.\nfn message() -> View {\n    let demo = column(24.0)\n        .child(\n            ui::message()\n                .end()\n                .child(ui::message_avatar().child(avatar(\"ME\")))\n                .child(\n                    ui::message_content()\n                        .child(ui::bubble().child(ui::bubble_content(\"Deploying to prod real quick.\"))),\n                ),\n        )\n        .child(\n            ui::message()\n                .child(ui::message_avatar().child(avatar(\"R\")))\n                .child(\n                    ui::message_content()\n                        .child(ui::bubble().muted().child(ui::bubble_content(\"It's 4:55 PM. On a Friday.\"))),\n                ),\n        )\n        .child(\n            ui::message()\n                .end()\n                .child(ui::message_avatar().child(avatar(\"ME\")))\n                .child(\n                    ui::message_content()\n                        .child(ui::bubble().child(ui::bubble_content(\"It's a one-line change.\")))\n                        .child(ui::message_footer().text(Some(\"Delivered\".into()))),\n                ),\n        )\n        .child(\n            ui::message()\n                .child(ui::message_avatar().child(avatar(\"R\")))\n                .child(\n                    ui::message_content().child(\n                        ui::bubble_group()\n                            .child(\n                                ui::bubble()\n                                    .muted()\n                                    .child(ui::bubble_content(\"It's always a one-line change 😭.\")),\n                            )\n                            .child(\n                                ui::bubble()\n                                    .muted()\n                                    .child(ui::bubble_content(\"Alright, let me take a look.\"))\n                                    .child(\n                                        ui::bubble_reactions()\n                                            .accessibility_label(Some(\"Reactions: thumbs up\".into()))\n                                            .child(text(\"👍\")),\n                                    ),\n                            ),\n                    ),\n                ),\n        )\n        .child(\n            ui::marker().child(\n                ui::marker_content(\"\").child(\n                    text(\"\")\n                        .child(text(\"Oliver\").font_weight(FontWeight::MEDIUM))\n                        .child(text(\" is typing...\")),\n                ),\n            ),\n        );\n    let with_attachment = column(32.0)\n        .child(\n            ui::message().end().child(\n                ui::message_content()\n                    .child(\n                        ui::attachment().vertical().child(\n                            ui::attachment_media()\n                                .variant(ui::AttachmentMediaVariant::Image)\n                                .src(Some(PHOTO.into()))\n                                .alt(Some(\"Workspace\".into())),\n                        ),\n                    )\n                    .child(ui::bubble().child(ui::bubble_content(\n                        \"Here's the image. Can you add it to the PDF? Use it for the cover page.\",\n                    ))),\n            ),\n        )\n        .child(\n            ui::message().child(\n                ui::message_content()\n                    .child(ui::bubble().muted().child(ui::bubble_content(\n                        \"Done. Here's the PDF with the image added as the cover page.\",\n                    )))\n                    .child(\n                        ui::attachment()\n                            .child(ui::attachment_media().icon(Some(IconName::FileText)))\n                            .child(\n                                ui::attachment_content()\n                                    .child(ui::attachment_title(\"sales-dashboard.pdf\"))\n                                    .child(ui::attachment_description(\"PDF · 2.4 MB\")),\n                            )\n                            .child(\n                                ui::attachment_actions().child(\n                                    ui::attachment_action(IconName::Download, \"Download\")\n                                        .size(ui::ButtonSize::IconSm)\n                                        .variant(ui::ButtonVariant::Secondary),\n                                ),\n                            ),\n                    ),\n            ),\n        )\n        .child(\n            ui::message()\n                .end()\n                .child(ui::message_content().child(ui::bubble().child(ui::bubble_content(\"Thanks. Looks good.\")))),\n        );\n    columns(demo, with_attachment)\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/chat.rs"}, {"id": "message-scroller", "title": "Message Scroller", "family": "Chat", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/chat/message_scroller.rs", "shadcn": "https://ui.shadcn.com/docs/components/message-scroller", "notes": ["It opens at the provider's `default_scroll_position`: the end (the default), the start, or the last anchored turn (the end when that turn fits).", "A row appended among the `scroll_anchors` (the user's message: a new turn) is scrolled to the top of the viewport, `scroll_previous_item_peek` (64) points of the turn before it left showing above it, and a tail spacer under the last row reserves the room for that: the reply then streams into the space below the turn, and nothing moves.", "With `auto_scroll`, while the reader is at the end (within `scroll_edge_threshold`, 8 points), it follows the end as the content grows (a reply streaming in, the viewport shrinking); a reply that fills the tail spacer hands the anchored turn over to following. Scrolling up leaves the reader where they are; back at the end, it follows again. Without `auto_scroll` nothing follows. The viewport resizing (a composer growing) holds the anchored turn in place.", "[`MessageScrollerButton`] shows while there is content past its edge, and scrolls there (following again, with `auto_scroll`).", "[`use_message_scroller`] scrolls to the end, the start or a message, and tells which edges can be scrolled toward and which messages show.", "The provider renders no element in shadcn; here it is a view (NSH has no `display: contents`): a column filling its parent (`flex size-full min-h-0 min-w-0 flex-col`).", "The viewport (`overflow-y-auto` in shadcn) is a view around the content, and the content (`flex h-max min-h-full flex-col gap-8`) the list that scrolls: its `gap` (32 points) and `padding` are props, a list's row gap and padding being its layout's, not classes. `scrollbar-thin`, `scrollbar-gutter-stable`, `overscroll-contain`, `contain-content`, `data-autoscrolling:scrollbar-none` and `data-pending-scroll:invisible` are left out (the list draws the platform's overlay scroll bar, and positions itself before its first frame). `scroll-fade-b` is a mask on the viewport fading the last `min(12%, 40px)` while there is content below, as shadcn's.", "An item's `[content-visibility:auto]` and `[contain-intrinsic-size:auto_10rem]` are left out: the list virtualizes. Its `messageId` and `scrollAnchor` are the content's `message_ids` and `scroll_anchors` (the list asks for rows as it needs them, so it knows them from the content).", "The button's `data-[active=…]:…` and `data-[direction=…]:…` are `data-active:…` and the direction's classes (NSH has the boolean `data-*` form only); they are on a view around the [`crate::Button`] (the button is the library's component); its `transition-[translate,scale,opacity]` is `transition`; `data-[direction=start]:[&_svg]:rotate-180` is the `arrow-up` icon; its `sr-only` label is the button's accessibility label.", "`role=\"log\"` and `aria-relevant=\"additions\"` are a polite live region on the content; `role=\"region\"` with the label \"Messages\" is the label of the viewport (NSH has no region role)."], "usage": "/// shadcn's `message-scroller-demo`: a chat card whose transcript opens at\n/// its end; Send appends the next message of the script (the user's turns\n/// anchor near the top).\nfn message_scroller() -> View {\n    let lines = signal(\n        SCRIPT[..4]\n            .iter()\n            .enumerate()\n            .map(|(i, &(user, text))| Line { id: format!(\"m{i}\").into(), user, text: signal(text.to_owned()) })\n            .collect::<Vec<_>>(),\n    );\n    let next = move || lines.with(|l| SCRIPT.get(l.len()).copied());\n    // The user's message lands whole; a reply streams in, a word every\n    // 25 ms.\n    let send = move || {\n        let Some((user, full)) = next() else { return };\n        let id = lines.with(|l| format!(\"m{}\", l.len())).into();\n        let text = signal(if user { full.to_owned() } else { String::new() });\n        lines.update(|l| l.push(Line { id, user, text }));\n        if !user {\n            spawn(async move {\n                let words: Vec<&str> = full.split(' ').collect();\n                for n in 1..=words.len() {\n                    timer(std::time::Duration::from_millis(25)).await;\n                    text.set(words[..n].join(\" \"));\n                }\n            });\n        }\n    };\n    let rows = virtual_list(move || lines.with(Vec::len), move |at| {\n        dynamic(move || {\n            lines\n                .with(|l| l.get(at.index()).cloned())\n                .map(|line| transcript_row(line).into_element())\n        })\n    })\n    .keys(move || lines.with(|l| l.iter().map(|l| l.id.clone()).collect::<Vec<_>>()));\n    let card = view()\n        .app_class(Some(SharedString::from(\n            \"flex h-[496px] w-full max-w-sm flex-col gap-0 overflow-hidden rounded-xl border border-border bg-card text-card-foreground shadow-sm\",\n        )))\n        .child(\n            view()\n                .app_class(Some(SharedString::from(\"flex flex-row items-start gap-4 border-b border-border px-6 py-4\")))\n                .child(\n                    view()\n                        .flex_1()\n                        .gap_1()\n                        .child(text(\"New Chat\").app_class(Some(SharedString::from(\"text-base leading-none font-semibold\"))))\n                        .child(\n                            text(\"How can I help you today?\")\n                                .app_class(Some(SharedString::from(\"text-sm text-muted-foreground\"))),\n                        ),\n                )\n                .child(\n                    ui::icon_button(IconName::RefreshCw, \"Reset conversation\")\n                        .outline()\n                        .on_press(move || lines.update(|l| l.truncate(4))),\n                ),\n        )\n        .child(\n            view().flex_1().min_h_0().child(\n                ui::message_scroller_provider().auto_scroll(true).child(\n                    ui::message_scroller()\n                        .child(\n                            ui::message_scroller_viewport().child(\n                                ui::message_scroller_content(rows)\n                                    .padding(24.0)\n                                    .message_ids(move || {\n                                        lines.with(|l| l.iter().map(|l| l.id.clone()).collect::<Vec<_>>())\n                                    })\n                                    .scroll_anc \n        .child(view().h(px(20.0)))\n        .child(\n            ui::marker()\n                .link(true)\n                .on_press(move || presses.update(|n| *n += 1))\n                .child(ui::marker_icon(IconName::GitBranch))\n                .child(ui::marker_content(\"View the pull request\")),\n        )\n        .child(view().h(px(20.0)))\n        .child(\n            ui::marker()\n                .pressable(true)\n                .app_class(Some(SharedString::from(\"transition-colors hover:text-foreground\")))\n                .on_press(move || presses.update(|n| *n += 1))\n                .child(ui::marker_icon(IconName::RotateCcw))\n                .child(ui::marker_content(\"Revert this change\")),\n        )\n        .child(view().h(px(20.0)))\n        .child(ui::marker().separator().child(ui::marker_content(\"Today\")))\n        .child(view().h(px(20.0)))\n        .child(note(\"\").child(text(move || format!(\"Pressed: {}\", presses.get()))));\n    columns(demo, right)\n}", "gallery": "https://github.com/caoxing9/nsh-shadcn/blob/main/examples/gallery/src/pages/chat.rs"}, {"id": "direction", "title": "Direction", "family": "Chat", "source": "https://github.com/caoxing9/nsh-shadcn/blob/main/src/ui/chat/direction.rs", "shadcn": "https://ui.shadcn.com/docs/components/direction", "notes": [], "usage": "/// shadcn's `DirectionProvider`: the same exchange left to right, and\n/// right to left.\nfn direction() -> View {\n    columns(\n        view().child(ui::direction_provider(ui::Direction::Ltr).child(exchange(\n            \"Can you summarize the release notes?\",\n            \"Sure. Three fixes and one new feature.\",\n            \"Switched to a new branch\",\n        ))),\n        view().child(ui::direction_provider(ui::Direction::Rtl).child(exchange(\n            \"هل يمكنك تلخيص ملاحظات الإصدار؟\",\n            \"بالتأكيد. ثلاثة إصلاحات وميزة جديدة.\",\n            \"تم التبديل إلى فرع جديد\",\n        ))),\n    )\n}", "gallery": "https://github. const state = { dark: false, id: null };
const PREFIX = "nsh:io.github.caoxing9.nsh-shadcn:";
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const code = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

function renderList(filter = "") {
  const q = filter.trim().toLowerCase();
  let html = q ? "" : `<h4>Getting started</h4><a href="#getting-started" class="${state.id === "getting-started" ? "active" : ""}">Introduction</a>`;
  let family = null;
  for (const c of DATA) {
    if (q && !c.title.toLowerCase().includes(q) && !c.id.includes(q)) continue;
    if (c.family !== family) { family = c.family; html += `<h4>${family}</h4>`; }
    html += `<a href="#${c.id}" class="${c.id === state.id ? "active" : ""}">${esc(c.title)}</a>`;
  }
  $("#list").innerHTML = html || `<p class="hint" style="padding:0 8px">No match.</p>`;
}

function highlight(src) {
  return esc(src)
    .replace(/(\/\/[^\n]*)/g, '<span class="cm">$1</span>')
    .replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)/g, '<span class="st">$1</span>')
    .replace(/\b(fn|let|move|use|pub|impl|for|in|if|else|match|mut|return|struct|enum|const|as)\b/g, '<span class="kw">$1</span>');
}

const START = `<div class="family">Getting started</div><h1>nsh-shadcn</h1>
<div class="doc">
<p>shadcn/ui for <a href="https://nsh.dev">NSH (Native Shell)</a>, in Rust: every component of shadcn's new-york-v4
registry with the same variants, sizes and look, drawn with native views. It is an
<a href="https://nsh.dev/docs/nshm">nshm</a>: one crate that Rust apps call and TSX apps import. Every component on
this site is live: NSH's web build of the gallery, running in the page — press, type and open things.</p>
<h2>Install</h2>
<p>A Rust app adds the crate:</p>
<pre><code>cargo add nsh-shadcn</code></pre>
<p>A TSX app (or any NSH app) installs it with the NSH CLI 0.7:</p>
<pre><code>nsh add nsh-shadcn</code></pre>
<h2>Use it from Rust</h2>
<pre><code>${highlight(`use nsh_core::prelude::*;
use nsh_shadcn::{self as ui, IconName};

#[component]
fn Toolbar() -> impl IntoElement {
    view()
        .flex_row()
        .gap_2()
        .child(ui::button("Save").on_press(|| save()))
        .child(ui::button("Cancel").outline())
        .child(ui::button("Delete").destructive().sm())
        .child(ui::icon_button(IconName::Plus, "Add").ghost())
}`)}</code></pre>
<p>Each component has a constructor taking what it needs (<code>button("Save")</code>, <code>badge("New")</code>,
<code>card()</code>) and setters named as shadcn's props (<code>.variant(..)</code>, <code>.size(..)</code>,
<code>.disabled(..)</code>), with shorthands for the variants (<code>.outline()</code>, <code>.sm()</code>).
Restyle one as you would with <code>className</code>: <code>.app_class("w-full")</code> — its classes come last, so
they win. Every page shows the Rust that draws it under <b>Usage</b>.</p>
<h2>Use it from TSX</h2>
<pre><code>${highlight(`import { Button } from "nsh-shadcn";

export default function Toolbar() {
  return <Button label="Save" variant="outline" size="sm" onPress={save} />;
}`)}</code></pre>
<p>Components keep their Rust names; props are camelCase.</p>
<h2>Theme</h2>
<p>The components draw on the app's theme, whose tokens are shadcn's (<code>background</code>, <code>primary</code>,
<code>muted-foreground</code>, <code>radius</code>…). NSH's default theme is shadcn's neutral; set
<code>"theme"</code> in <code>nsh.json</code> to a file of shadcn <code>cssVars</code> — from shadcn's themes or
tweakcn — for another look. Light and dark follow the system.</p>
<h2>Differences from the browser</h2>
<p>A component uses shadcn's own class strings. Where NSH has no equivalent (descendant selectors, <code>calc()</code>,
tw-animate-css…), the component's page lists what it does instead, under <b>Where NSH differs</b>.</p>
</div>`;

function renderMain() {
  if (state.id === "getting-started") {
    $("#main").innerHTML = START;
    $("#main").scrollTop = 0;
    document.title = "nsh-shadcn";
    return;
  }
  const c = DATA.find((d) => d.id === state.id) || DATA[0];
  const live = `<div class="live"><iframe id="demo" title="${esc(c.title)} (live)"></iframe>
    <div class="loading" id="loading">Loading the live component…</div>
    <p>Live: the component drawn by NSH's web runtime. The same Rust draws it natively on macOS, iOS, Android, Windows and Linux.</p></div>`;
  const notes = c.notes.length ? `<div class="notes"><h2>Where NSH differs</h2>
    <p>The component uses shadcn's own classes; these are the places NSH needs something else.</p>
    <ul>${c.notes.map((n) => `<li>${code(n)}</li>`).join("")}</ul></div>` : "";
  const usage = c.usage ? `<div class="usage"><h2>Usage</h2><div class="bar">
    <p>The Rust that draws this page (<code>use nsh_shadcn as ui;</code>).</p>
    <button class="btn" id="copy">Copy</button><a class="btn" href="${c.gallery}">Gallery source</a></div>
    <pre><code>${highlight(c.usage)}</code></pre></div>` : "";
  $("#main").innerHTML = `<div class="family">${c.family}</div><h1>${esc(c.title)}</h1>
    <div class="links"><a class="btn" href="${c.source}">Component source</a><a class="btn" href="${c.shadcn}">shadcn/ui docs</a></div>
    ${live}${usage}${notes}`;
  loadDemo(c.id);
  const copy = $("#copy");
  if (copy) copy.onclick = () => navigator.clipboard.writeText(c.usage).then(() => {
    copy.textContent = "Copied";
    setTimeout(() => (copy.textContent = "Copy"), 1200);
  });
  $("#main").scrollTop = 0;
  document.title = `${c.title} — nsh-shadcn`;
}

function loadDemo(id) {
  // The gallery reads these when it starts (examples/gallery/src/lib.rs).
  localStorage.setItem(PREFIX + "page", id);
  localStorage.setItem(PREFIX + "bare", "1");
  localStorage.setItem(PREFIX + "scheme", state.dark ? "dark" : "light");
  const frame = $("#demo"), loading = $("#loading");
  frame.onload = () => setTimeout(() => loading.classList.add("done"), 1200);
  frame.src = "demo/index.html?" + id + "-" + (state.dark ? "dark" : "light");
}

function route() {
  state.id = location.hash.slice(1) || "getting-started";
  renderList($("#search").value);
  renderMain();
  document.querySelector("nav a.active")?.scrollIntoView({ block: "nearest" });
}

$("#theme").onclick = () => {
  state.dark = !state.dark;
  document.documentElement.classList.toggle("dark", state.dark);
  $("#theme").textContent = state.dark ? "Light" : "Dark";
  renderMain();
};
$("#search").oninput = (e) => renderList(e.target.value);
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const ids = ["getting-started", ...DATA.map((d) => d.id)];
  const i = ids.indexOf(state.id);
  if (e.key === "ArrowDown" || e.key === "ArrowRight") location.hash = ids[Math.min(i + 1, ids.length - 1)];
  if (e.key === "ArrowUp" || e.key === "ArrowLeft") location.hash = ids[Math.max(i - 1, 0)];
});
if (matchMedia("(prefers-color-scheme: dark)").matches) $("#theme").click();
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
